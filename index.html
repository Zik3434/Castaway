<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Castaway</title>
<meta name="description" content="A pixel-art fishing and hunting game. Stranded on an island, you fish your way off it and across a sea of strange islands. Plays in the browser on phone and desktop.">
<meta name="theme-color" content="#0a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Castaway">
<meta property="og:title" content="Castaway">
<meta property="og:description" content="A pixel-art fishing and hunting game you play in the browser.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: the pixel scene is a fixed canvas filling the viewport. Everything else floats over it:
   a HUD strip at the top, open sky and water in the middle, a translucent control panel at the bottom.
   Title and cutscene screens are full-viewport overlays on the same canvas.
   Single theme on purpose: tar, brass and lantern light. */
:root{
  --ink:#0a1020;
  --panel:rgba(11,17,34,.86);
  --panel-solid:#141f38;
  --panel-2:#20325a;
  --edge:#3a5080;
  --text:#ece6d6;
  --muted:#a3aec6;
  --brass:#f0c050;
  --brass-2:#b8871c;
  --brass-3:#5e440a;
  --good:#8ad48a;
  --bad:#e27b5f;
  --display:'Press Start 2P','VT323',monospace;
  --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--ink);color:var(--text);font-family:var(--body);font-size:20px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:linear-gradient(rgba(10,16,32,.8),rgba(10,16,32,0))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#scene{position:fixed;left:0;top:0;z-index:0;pointer-events:none}
#fade{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .55s}
#fade.on{opacity:1;pointer-events:auto}
.screen{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(44px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#title .logo{font-family:var(--display);font-size:clamp(26px,8.5vw,44px);color:var(--brass);letter-spacing:2px;text-align:center;
  text-shadow:3px 3px 0 #2b1d05,6px 6px 0 rgba(0,0,0,.35)}
#title .tagline{font-size:23px;text-shadow:2px 2px 0 #0a1020;color:var(--text)}
#title .menu{display:grid;gap:10px;width:min(100%,300px);margin-top:14px}
#title .vers{color:var(--muted);font-size:17px;text-shadow:1px 1px 0 #0a1020}
#title .confirm{color:var(--bad);font-size:18px;text-shadow:1px 1px 0 #0a1020;min-height:1.2em;text-align:center}
#cut{cursor:pointer;gap:10px}
#cut .cap{font-family:var(--display);font-size:clamp(11px,3.4vw,15px);line-height:1.9;color:var(--text);text-align:center;
  text-shadow:2px 2px 0 #0a1020;max-width:440px;min-height:3.8em;opacity:0;transition:opacity .5s}
#cut .cap.show{opacity:1}
#cut .hint{color:var(--muted);font-size:18px;text-shadow:1px 1px 0 #0a1020}
#cut .choice{display:grid;gap:12px;justify-items:center;padding:14px 16px;background:rgba(10,16,32,.78);border:3px solid var(--brass);max-width:320px;width:calc(100% - 32px)}
#cut .choice .q{font-family:var(--display);font-size:clamp(11px,3.4vw,15px);color:var(--brass);text-align:center}
#cut .choice .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
#cut .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#game{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto}
#hud,.ihud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;gap:8px;padding:12px 0 14px;
  background:linear-gradient(rgba(10,16,32,.82),rgba(10,16,32,.5) 65%,rgba(10,16,32,0))}
#hud .top,.ihud .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud .loc,.ihud .loc{font-family:var(--display);font-size:12px;color:var(--brass);text-wrap:balance;text-shadow:2px 2px 0 #0a1020}
#hud .sub,.ihud .sub{color:var(--text);font-size:18px;margin-top:5px;font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 #0a1020}
#hud .right,.ihud .right{text-align:right}
#hud .money,.ihud .money{font-family:var(--display);font-size:12px;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #0a1020}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font-family:var(--display);font-size:9px;padding:9px 4px;background:rgba(11,17,34,.72);border:2px solid var(--edge);color:var(--text)}
.tabs button.pulse{border-color:var(--brass);color:var(--brass)}
.spacer{flex:1;min-height:33vh}
#panel{background:var(--panel);border:2px solid var(--edge);border-bottom:0;border-top-color:rgba(240,192,80,.55);
  padding:9px 10px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.tide{font-size:17px;color:var(--muted);text-align:center;text-wrap:balance;padding:0 2px}
.tide b{color:var(--text);font-weight:normal}
.tide.tut{background:rgba(240,192,80,.1);border:2px solid var(--brass-2);padding:7px 8px;color:var(--text);font-size:18px}
.tide.tut b{color:var(--brass)}
.cta.tut{box-shadow:0 0 0 3px var(--brass),0 4px 0 var(--brass-3);animation:thump .5s infinite alternate}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slots.solo{grid-template-columns:1fr}
.slot{width:100%;background:rgba(10,16,32,.55);border:2px solid var(--edge);padding:8px 3px 6px;display:grid;gap:4px;min-width:0;text-align:center}
.slot .n{font-family:var(--display);font-size:8px;color:var(--muted)}
.slot .st{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel{border-color:var(--brass);background:var(--panel-2)}
.slot.sel .n{color:var(--brass)}
.slot.on .st{color:var(--brass)}
.slot.hot{border-color:var(--bad);background:rgba(120,40,30,.35);animation:glow .9s infinite alternate}
.slot.hot .st{color:var(--bad)}
.slot.lock{border-style:dashed;opacity:.55}
.box{display:grid;gap:7px}
.box h3{margin:0;font-family:var(--display);font-size:9px;color:var(--muted);letter-spacing:.5px}
.lhead{display:flex;justify-content:space-between;align-items:baseline}
.lhead h3{margin:0;font-family:var(--display);font-size:9px;color:var(--brass);letter-spacing:.5px}
.lhead .note{font-size:17px}
.rigrow{display:flex;align-items:center;gap:6px;background:rgba(10,16,32,.6);border:2px solid var(--edge);padding:4px 6px}
.rigrow .chip{flex:0 1 auto;min-width:0;padding:6px 6px;background:none;border:2px solid transparent;font-family:var(--display);font-size:9px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rigrow .chip:active{border-color:var(--edge)}
.rigrow .dot{color:var(--muted)}
.rigsum{flex:1;min-width:0;display:grid;gap:3px;padding:2px 4px}
.rigsum .l1{font-family:var(--display);font-size:9px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rigsum .l2{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rigbtn{flex:none;font-family:var(--display);font-size:9px;padding:10px 10px;background:var(--panel-2);color:var(--brass);border:2px solid var(--brass);text-transform:uppercase}
.rigrow .link{margin-left:auto;flex:none;padding:6px 4px;background:none;border:0;font-family:var(--display);font-size:9px;color:var(--brass)}
.rigrow.open .link{color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bar .tool{display:grid;gap:3px;text-align:left;padding:8px 10px;background:rgba(10,16,32,.6);border:2px solid var(--edge);min-width:0}
.bar .tool .n{font-family:var(--display);font-size:8px;color:var(--muted)}
.bar .tool .v{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bar .tool.sell{border-color:var(--brass-2)}
.bar .tool.sell .n,.bar .tool.sell .v{color:var(--brass)}
.bar .tool[disabled]{opacity:.5;cursor:default}
.bar .tool:only-child{grid-column:1/-1}
.segrow{display:flex;align-items:center;gap:6px}
.segrow .lbl{font-family:var(--display);font-size:8px;color:var(--muted);width:42px;flex:none}
.seg{display:flex;gap:4px;flex:1;min-width:0}
.seg button{flex:1 1 0;min-width:0;padding:7px 3px;background:rgba(10,16,32,.6);border:2px solid var(--edge);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sel{border-color:var(--brass);color:var(--brass);background:var(--panel-2)}
.seg button[disabled]{opacity:.45;cursor:default}
.seg button.unknown{opacity:.7}
.seg button.unknown span{color:var(--muted);letter-spacing:2px}
.seg.icons button{display:grid;justify-items:center;gap:4px;padding:8px 3px 7px}
.seg.icons button span{font-size:16px}
canvas.icon{width:40px;height:40px;image-rendering:pixelated;flex:none}
.row canvas.icon{background:rgba(10,16,32,.6);border:2px solid var(--edge);padding:2px;box-sizing:content-box}
.row.sel canvas.icon{border-color:var(--brass)}
.note{color:var(--muted);font-size:17px}
.cta{font-family:var(--display);font-size:13px;padding:15px 10px;background:var(--brass);color:#2b1d05;border:3px solid var(--brass-2);box-shadow:0 4px 0 var(--brass-3);text-transform:uppercase}
.cta:active{transform:translateY(3px);box-shadow:none}
.cta.alt{background:var(--panel-2);color:var(--text);border-color:var(--edge);box-shadow:0 4px 0 #0b1223}
.cta.go{background:var(--panel-2);color:var(--brass);border-color:var(--brass-2);box-shadow:0 4px 0 #0b1223}
.cta.hit{background:var(--bad);border-color:#a44f36;box-shadow:0 4px 0 #5a2a1c;color:#2a0d05;animation:thump .35s infinite alternate}
.cta[disabled]{opacity:1;cursor:default;transform:none;background:#2c3444;color:#7d8697;border-color:#3b4454;box-shadow:0 4px 0 #1a2030;text-shadow:none}
@keyframes thump{from{transform:translateY(0)}to{transform:translateY(2px)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(226,107,90,0)}to{box-shadow:0 0 12px 3px rgba(226,107,90,.8)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row .name{min-width:0}
.row .name small{display:block;color:var(--muted);font-size:17px}
.row .price{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--brass)}
.buy{font-family:var(--display);font-size:9px;padding:8px 10px;background:var(--panel-2);border:2px solid var(--edge);white-space:nowrap}
.buy[disabled]{opacity:.4;cursor:default}
.list{display:grid;gap:2px}
.list .row{padding:8px 6px;border-bottom:1px solid var(--edge)}
.list .row.dim{opacity:.55}
.list canvas.mini{width:96px;height:auto;flex:none;background:var(--ink);border:1px solid var(--edge)}
.list canvas.mini.game{width:120px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.8);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.center{align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--panel-solid);border:3px solid var(--edge);border-bottom:0;
  padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;align-content:start}
.sheet .head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-family:var(--display);font-size:13px;color:var(--brass)}
.x{font-family:var(--display);font-size:11px;padding:8px 10px;background:var(--panel-2);border:2px solid var(--edge)}
.card{width:100%;max-width:360px;background:var(--panel-solid);border:3px solid var(--brass);padding:14px;display:grid;gap:8px;text-align:center;justify-items:center}
.card h2{margin:0;font-family:var(--display);font-size:13px;color:var(--brass);text-wrap:balance}
.card .big{font-size:22px}
.card .tag{color:var(--good);font-family:var(--display);font-size:9px}
.card canvas{width:144px;height:auto;background:var(--ink);border:2px solid var(--edge)}
.card.catch{max-width:400px;padding:16px 14px;gap:10px;justify-items:stretch}
.catch .head{font-family:var(--display);font-size:clamp(20px,7vw,30px);color:var(--brass);text-shadow:3px 3px 0 #2b1d05;line-height:1.2}
.catch .pill{justify-self:center;font-family:var(--display);font-size:8px;padding:6px 10px;background:#2a5a74;color:var(--text);letter-spacing:.5px}
.catch .pill.gold{background:var(--brass-2);color:#2b1d05}
.catch .pill.far{background:#5a3a74}
.chip.static{opacity:.75}
.list .row.sel{border-left:3px solid var(--brass);padding-left:6px}
.legend small .kind{color:var(--brass-2);font-family:var(--display);font-size:8px;letter-spacing:.5px}
.keeper .krow{display:flex;gap:12px;align-items:center}
.keeper canvas.face{width:144px;height:144px;image-rendering:pixelated;border:3px solid #2a3a50;box-shadow:0 3px 0 #0a1424;background:#0a1020;flex:none}
.keeper .kside{display:grid;gap:10px;flex:1}
.keeper .name small{display:block;color:var(--muted);font-size:17px}
.keeper .speech{position:relative;background:#f4ecd0;color:#2b1d05;padding:10px 12px;font-size:18px;line-height:1.25;border:2px solid #b89a5a;box-shadow:3px 3px 0 #0a1424}
.keeper .speech::before{content:'';position:absolute;left:60px;top:-9px;border:8px solid transparent;border-top:0;border-bottom-color:#f4ecd0}
.keeper .speech b{color:#7a4a10}
@media (max-width:400px){.keeper canvas.face{width:96px;height:96px}}
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-top:6px}
.poster{position:relative;background:#e8d9a8;color:#2b1d05;padding:12px 8px 8px;display:grid;gap:5px;justify-items:center;text-align:center;border:2px solid #b89a5a;box-shadow:3px 3px 0 #0a1424}
.poster .nail{position:absolute;top:3px;left:50%;width:6px;height:6px;margin-left:-3px;background:#6a6a70;border-radius:50%;box-shadow:inset -1px -1px 0 #2a2a30}
.poster .wanted{font-family:var(--display);font-size:11px;letter-spacing:1px;margin-top:2px}
.poster canvas.mini{border:1px solid #b89a5a}
.poster .pname{font-size:16px;line-height:1.1}
.poster .pays{font-family:var(--display);font-size:8px;color:#8a4a10}
.poster .pays.dim{color:#8a7a5a}
.poster .buy{font-size:8px;padding:6px 6px}
.poster.done{opacity:.55}
.poster .stamp{font-family:var(--display);font-size:10px;color:#a02020;border:2px solid #a02020;padding:2px 6px;transform:rotate(-8deg)}
.catch .rar{display:flex;justify-content:center;gap:8px;font-family:var(--display);font-size:9px;letter-spacing:.5px;text-shadow:2px 2px 0 #0a1424}
.catch .rar .sep{color:var(--muted)}
.catch .pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.catch canvas.art{width:100%;max-width:300px;justify-self:center;border:2px solid var(--edge)}
.catch .fish{font-family:var(--display);font-size:13px;color:var(--text);text-wrap:balance}
.catch .size{display:flex;justify-content:center;align-items:baseline;gap:10px;font-family:var(--display);font-size:clamp(14px,5.2vw,24px);color:var(--brass);text-shadow:3px 3px 0 #2b1d05}
.catch .size span{white-space:nowrap}
.catch .size .sep{color:var(--brass-2);text-shadow:none}
.catch .sub{color:var(--muted);font-size:18px}
.catch .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:left}
.catch .stat{background:rgba(10,16,32,.6);border:2px solid var(--edge);padding:8px 8px}
.catch .stat .n{font-family:var(--display);font-size:8px;color:var(--brass)}
.catch .stat .v{font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catch .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catch .acts .cta:only-child{grid-column:1/-1}
.catch .warn{color:var(--bad);font-size:17px}
#fightWrap{background:transparent;align-items:flex-start;justify-content:flex-end;padding-top:calc(19vh + env(safe-area-inset-top,0px))}
.fightbox{width:auto;max-width:none;display:grid;gap:5px;justify-items:center;touch-action:none;user-select:none;-webkit-user-select:none;background:rgba(11,17,34,.6);border:2px solid var(--edge);padding:6px 6px 7px}
.fightbox canvas{width:176px;height:auto;border:2px solid var(--edge)}
.fightbox .fname{font-family:var(--display);font-size:9px;color:var(--brass);text-align:center;max-width:176px;line-height:1.6}
.fightbox .note{font-size:14px;max-width:176px;line-height:1.1}
.toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:30;padding:0 16px}
.toast{background:var(--panel-2);border:2px solid var(--brass);padding:7px 12px;font-size:19px;max-width:420px;text-align:center}
#mapcv{width:100%;height:auto;border:3px solid #2a3a50;background:#07070b;max-height:46vh;object-fit:contain}
.legend{display:grid;gap:4px}
.legend button{width:100%;text-align:left;background:none;border:2px solid transparent;padding:6px 6px;color:inherit}
.legend button.sel{border-color:var(--brass);background:var(--panel-2)}
.legend button.dim{opacity:.55}
.legend .here{color:var(--good);font-size:17px;white-space:nowrap}
#isle,#hunt{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto}
#ipanel,#hpanel{background:var(--panel);border:2px solid var(--edge);border-bottom:0;border-top-color:rgba(240,192,80,.55);padding:9px 10px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.walkrow{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:stretch}
.walk{font-family:var(--display);font-size:16px;background:var(--panel-2);border:2px solid var(--edge);color:var(--brass);padding:14px 0;user-select:none;-webkit-user-select:none;touch-action:none}
.walk:active{background:var(--edge)}
.walkrow .cta{padding:12px 6px;font-size:11px}
.walkrow .ghost{visibility:hidden}
.hbar{position:relative;height:20px;background:rgba(10,16,32,.7);border:2px solid var(--edge)}
.hband{position:absolute;top:0;bottom:0;background:rgba(240,192,80,.35);border-left:1px solid var(--brass);border-right:1px solid var(--brass)}
.hmark{position:absolute;top:-4px;width:3px;height:24px;background:var(--text);margin-left:-1px}
.hbar.hold .hmark{background:var(--brass)}
.hbar.hit .hband{background:rgba(138,212,138,.6)}
.hbar.miss .hband{background:rgba(226,123,95,.6)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter .lbl{display:block;font-family:var(--display);font-size:7px;color:var(--muted);margin-bottom:3px;letter-spacing:.5px}
.hbar.thin{height:8px}
.hband.fill{left:0;border:0}

<canvas id="scene" width="195" height="375"></canvas>
<div id="fade"></div>

<div class="screen" id="title">
  <div class="menu">
    <button class="cta alt" data-act="continue" id="bCont" hidden>Continue</button>
    <button class="cta" data-act="new" id="bNew">New voyage</button>
  </div>
  <div class="confirm" id="confirm"></div>
  <div class="vers">prototype · everything is placeholder art</div>
</div>

<div class="screen" id="cut" hidden>
  <button class="x skip" data-act="skip">SKIP</button>
  <div class="cap" id="cap"></div>
  <div class="choice" id="choice" hidden><div class="q">Hold on to your rod?</div><div class="opts"><button class="cta" data-act="hold">Hold on</button><button class="cta alt" data-act="letgo">Let go</button></div></div>
  <div class="hint" id="cutHint">tap to continue</div>
</div>

<div id="game" hidden>
  <header id="hud">
    <div class="top">
      <div><div class="loc" id="hLoc">Wreck Shoal</div><div class="sub" id="hClock">06:00 · Dawn</div></div>
      <div class="right"><div class="money" id="hMoney">$0</div><div class="sub" id="hBucket">Bucket 0/20</div></div>
    </div>
    <nav class="tabs">
      <button data-act="open" data-k="map" id="tMap">Map</button>
      <button data-act="open" data-k="index">Index</button>
      <button data-act="open" data-k="shop" id="tShop" hidden>Shop</button>
      <button data-act="open" data-k="spots" id="tSpots">Spots</button>
      <button data-act="walk" id="tWalk">Walk</button>
      <button data-act="open" data-k="menu">Menu</button>
    </nav>
  </header>
  <div class="spacer"></div>
  <section id="panel">
    <div class="tide" id="tide"></div>
    <div class="lhead"><h3>LINES</h3><div class="note" id="ready"></div></div>
    <div class="slots" id="slots"></div>
    <div class="box" id="action"></div>
    <div id="extra" style="display:grid;gap:8px"></div>
  </section>
</div>

<div id="isle" hidden>
  <header class="ihud">
    <div class="top">
      <div><div class="loc" id="iName"></div><div class="sub" id="iVibe"></div></div>
      <div class="right"><div class="money" id="iMoney"></div><div class="sub" id="iClock"></div></div>
    </div>
    <nav class="tabs">
      <button data-act="open" data-k="map">Chart</button>
      <button data-act="open" data-k="index">Index</button>
      <button data-act="open" data-k="inv">Bag</button>
      <button data-act="open" data-k="menu">Menu</button>
    </nav>
  </header>
  <div class="spacer"></div>
  <section id="ipanel">
    <div class="tide" id="iHint"></div>
    <div class="walkrow"><button class="walk" data-hold="-1" aria-label="walk left">◀</button><button class="cta" id="iAct" data-act="enter"></button><button class="walk" data-hold="1" aria-label="walk right">▶</button></div>
  </section>
</div>
<div id="hunt" hidden>
  <header class="ihud">
    <div class="top">
      <div><div class="loc" id="hName"></div><div class="sub" id="hSub"></div></div>
      <div class="right"><div class="money" id="hMoney"></div><div class="sub" id="hBag"></div></div>
    </div>
    <nav class="tabs"><button data-act="leavehunt">Back to the village</button><button data-act="open" data-k="kit">Kit</button><button data-act="open" data-k="inv">Bag</button></nav>

  <div class="spacer"></div>

    <div class="tide" id="hNote"></div>
    <div class="hbar" id="hbar"><div class="hband" id="hband"></div><div class="hmark" id="hmark"></div></div>

</div>
<div class="toasts" id="toasts"></div>
<div class="overlay" id="sheetWrap" hidden><div class="sheet" id="sheet"></div></div>

  { id: 'dyers', name: 'Murex Harbour', title: 'Dyers\' Port', range: 2, shop: true, sell: true, x: 100, y: 124, links: ['harbor', 'lantern', 'fen', 'wreckers'],

  { id: 'terrace', name: 'Thousand Steps', title: 'Terrace Island', range: 2, shop: true, sell: true, x: 136, y: 138, links: ['lantern', 'market', 'delta', 'graveyard', 'spice', 'ghats'],

    keeper: { name: 'Grandmother Hoa', lines: ['"Every terrace is a pond and every pond has a fish. Start at the bottom. The top is for the gods."', '"Mud fish in the paddies, gold fish in the pond, a big dark one in the reservoir that we do not fish."', '"When the terraces flood after rain, the ponds join up, and what comes down from the top is not from any pond."'] },

    hunt: { kind: 'bamboo', name: 'the upper terraces', gate: 'a bamboo ladder up the terrace wall' }, spots: [{ id: 'paddy', kind: 'pond', name: 'The Low Paddies', known: 'Knee-deep mud and rice stalks. Whiskered things squirm in it and small gold flashes feed between the stems.', fish: { commoncarp: .8, pondloach: 1.8, silverbarb: 1, snakeskingourami: 1.6, mudcarp: 1.6 } }, { id: 'pond', kind: 'pond', name: 'The Mirror Pond', known: 'A terrace kept clear for the house. Gold and silver turn in it slowly, and a long dark snout sometimes shows at the edge.', fish: { commoncarp: 1.6, silverbarb: 1.6, snakeskingourami: 1, harlequinrasbora: 1 } }, { id: 'reservoir', kind: 'lake', name: 'The Reservoir', known: 'The terrace above all the others, deep and cold. Heavy heads cruise it and the village does not fish it.', fish: { commoncarp: 1.2, mudcarp: .6, bigheadcarp: 1.8, terracedragon: 1 } }, { id: 'spill', kind: 'river', name: 'The Spillway', known: 'Water falling step to step. Quick small fish hold under each fall and big mouths wait at the bottom.', fish: { pondloach: 1, silverbarb: 1.4, mudcarp: 1.2, harlequinrasbora: 1.8 } }, { id: 'open', kind: 'open', boat: true, name: 'The Flooded Fields', known: 'After rain the terraces join into one lake and you pole across it. Everything from the top comes down.', fish: { commoncarp: 1, bigheadcarp: 1.4, harlequinrasbora: .5, pondloach: .5, silverbarb: .5 } }] },
  { id: 'graveyard', name: 'Hulk Row', title: 'Ship Graveyard', range: 3, shop: true, sell: true, x: 160, y: 146, links: ['market', 'pirate', 'terrace', 'cinder', 'ghats', 'iguanas'],

    rumor: 'A place where ships go to die and people live in what is left. There is no ground. Only decks.',

    hunt: { kind: 'wrecks', name: 'the broken row', gate: 'a gangplank onto the old hulls' }, spots: [{ id: 'keels', kind: 'wreck', name: 'Under the Keels', known: 'The water between hulls. Long striped shapes hang in the dark, and a reef-dwelling heavyweight owns each wreck.', fish: { wreckfish: .8, dragonet: .8, leopardgoby: 1.4, boarfish: 1.6, figurehead: 1, pollack: 1.8 } }, { id: 'holds', kind: 'cave', name: 'The Flooded Holds', known: 'Inside a hull, under the water line. Things with beards and things with teeth live where the cargo was.', fish: { redbandfish: 1.6, leopardgoby: 1.6, forkbeard: 1.8 } }, { id: 'spars', kind: 'rocks', name: 'The Spar Field', known: 'Masts and yards lying in shallow water. Bright small fish, a spined oddity, and a gurnard colour or two.', fish: { tubgurnard: 1.6, dragonet: 1.8, leopardgoby: 1, boarfish: 1, pollack: 1.2 } }, { id: 'scuttle', kind: 'deep', name: 'The Scuttling Ground', known: 'Where the hopeless hulls are sunk. Deep, cold, and home to the biggest tenant on the row.', fish: { wreckfish: 1.8, tubgurnard: .8, redbandfish: 1, forkbeard: 1.2 } }, { id: 'open', kind: 'open', boat: true, name: 'The Approaches', known: 'Off the row in your own boat. The big wreck-dwellers wander between hulls and a pale shape comes up from the Scuttling Ground.', fish: { wreckfish: 1, pollack: 1.2, leopardgoby: .5, dragonet: .5, redbandfish: .5 } }] },
  { id: 'steppe', name: 'Burkhan Shore', title: 'Steppe Island', range: 3, shop: true, sell: true, x: 100, y: 66, links: ['trench', 'sargasso', 'sleeper', 'throat', 'city'],
    blurb: 'Grass to the horizon, one cold river through it, and a people who fish with eagles.', vibe: 'Felt tents, horses hobbled by the water, a hooded eagle on every other fist, a river the colour of steel.',
    rumor: 'An island that is all grass and one river. The people there hunt with birds and will not say what the birds are afraid of.',
    keeper: { name: 'Altan the Falconer', lines: ['"The eagle takes what runs. The rod takes what swims. Both need patience and a glove."', '"Red flanks in the fast water, long spotted hunters in the pools, and in the deep bend something older than the tents."', '"The eagles will not fly over the deep bend. We have stopped asking them."'] },

  { id: 'cannery', name: 'Tin Row', title: 'Cannery Island', range: 3, shop: true, sell: true, x: 64, y: 138, links: ['harbor', 'brine', 'oyster', 'wreckers', 'whirlpool', 'pilchard'],

  { id: 'whirlpool', name: 'Naruto Gate', title: 'Whirlpool Strait', range: 3, shop: true, sell: true, x: 80, y: 172, links: ['brine', 'gannet', 'cannery', 'frogs', 'folio', 'flamingo'],

    keeper: { name: 'Tsukasa', lines: ['"Fish the slack. Fish the turn. Never fish the whirl itself. The whirl fishes you."', '"Red bodies on the sand, silver swords in the current, and under the bridge a fat thing with a poison mouth."', '"Something turns with the whirl. Not against it. With it. The shrine is for that."'] },

  { id: 'coral', name: 'Pearl Reach', title: 'Coral City', range: 4, shop: true, sell: true, x: 204, y: 112, links: ['biolum', 'cinder', 'mirage', 'deadsea'],

    keeper: { name: 'Tui Leota', lines: ['"We do not use hooks here. You may. The reef will decide if it approves."', '"Spotted red mouths in the coral heads, blue flashes along the wall, and the big lips that we only take for a wedding."', '"Deep in the pass there is a mother of pearls. The divers leave her a shell every year and she has never come up."'] },

    village: { kind: 'stilt', props: [['palm', .08], ['net', .32], ['crate', .7], ['palm', .9]] },
    hunt: { kind: 'dunes', name: 'the motu', gate: 'a path between two palms' }, spots: [{ id: 'heads', kind: 'reef', name: 'The Coral Heads', known: 'Bommies in clear water. Spotted red mouths sit in the holes, blue tails pick at the coral, and a sweet-lipped shape sulks under the ledges.', fish: { coraltrout: 1.8, bumphead: .8, sweetlips: 1.6, spangledemperor: .8, unicornfish: 1 } }, { id: 'wall', kind: 'deep', name: 'The Outer Wall', known: 'Where the reef drops into blue. Big lips cruise it, unicorns and triggers patrol it, and the pass runs beside.', fish: { coraltrout: .8, humpheadwrasse: 1.6, spangledemperor: .6, unicornfish: 1.8, titantrigger: 1.6 } }, { id: 'lagoon', kind: 'lagoon', name: 'The Pearl Lagoon', known: 'Calm and shallow, shells on the bottom. Small bright grazers and a bumping parrot shape.', fish: { bumphead: 1.6, sweetlips: 1, spangledemperor: 1.2 } }, { id: 'pass', kind: 'channel', name: 'The Pass', known: 'Where the ocean breathes in and out of the lagoon. Everything comes through on the tide, and something old waits deep in it.', fish: { coraltrout: 1, humpheadwrasse: 1, spangledemperor: 1.6, titantrigger: 1.2, pearlmother: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'Outside the Reef', known: 'Blue water from an outrigger. The wall-cruisers and the biggest lips turn here, and the pass empties into it.', fish: { humpheadwrasse: .8, spangledemperor: 1, unicornfish: .5, sweetlips: .5 } }] },
  { id: 'rookery', name: 'Skua Point', title: 'Penguin Rookery', range: 4, shop: false, sell: true, x: 14, y: 26, links: ['monastery', 'iceship', 'ink', 'salmonrun'],
    blurb: 'A sub-polar rock of penguins, elephant seals and one research hut that buys fish for the stove.', vibe: 'Fifty thousand penguins and the smell of them, seals like fallen hills, a hut with a stovepipe and a scientist who pays in coin.',
    rumor: 'A rock at the bottom of the world, black with penguins. There is a hut. The one in it buys what you catch.',
    scene: { shore: 'rock', floor: [[80, 90, 100], [20, 30, 50]], far: 'mountains', props: [['cairn', .12], ['crate', .36], ['sled', .56], ['barrel', .78]], particles: 'snow' },
    village: { kind: 'longhouse', props: [['sled', .1], ['crate', .3], ['barrel', .72], ['cairn', .9]] },
    hunt: { kind: 'tundra', name: 'the rookery', gate: 'a marked path through the colony' }, keeper: { name: 'Doctor Lind', lines: ['"I count penguins. Fifty-one thousand this morning. Fish feeds the stove and the counting."', '"The kelp holds the cod shapes. The shelf drops to nothing. Night brings up lights."', '"Something white came in with a berg and the colony went silent for a week. I have one photograph."'] },
    spots: [{ id: 'colony', kind: 'shore', name: 'Below the Colony', known: 'Water full of birds. Silver sprats in clouds, white-blooded ghosts under them, and ice-coloured skates on the bottom.', fish: { icefish: 1.6, rockcod: 1, silverfish: 1.8 } }, { id: 'kelpbed', kind: 'kelp', name: 'The Giant Kelp', known: 'Cold kelp as thick as rope. Marbled cod shapes hang in it and spiny plunderers sit on the holdfasts.', fish: { rockcod: 1.8, plunderfish: 1.6 } }, { id: 'shelf', kind: 'deep', name: 'The Shelf Break', known: 'Where the rock drops to the abyss. Lanterns rise at night, and the great toothed sinker lives at the bottom of it all.', fish: { toothfish: 1.8, icefish: 1, silverfish: .8, eelcod: 1.8, southernwhiting: 1.4, oldice: 1 } }, { id: 'tidepool', kind: 'rocks', name: 'The Seal Pools', known: 'Pools the elephant seals wallow in. Small clear-finned things and the odd ghost in the deep end.', fish: { icefish: 1, plunderfish: 1.6 } }, { id: 'open', kind: 'open', boat: true, name: 'The Southern Ocean', known: 'Grey water from your own boat, birds everywhere. The deep toothed giant comes up at night, and silver in daylight.', fish: { toothfish: 1, silverfish: 1.4, eelcod: 1, southernwhiting: 1.6, icefish: .5 } }] },
  { id: 'geyser', name: 'Steam Strand', title: 'Geyser Island', range: 4, shop: true, sell: true, x: 62, y: 8, links: ['iceship', 'whaling', 'fjord', 'salmonrun', 'totem'],
    blurb: 'Black sand, hot springs steaming into a cold sea, and a village roofed with turf.', vibe: 'Steam rising from the ground, turf roofs, a geyser that goes off on the hour, cold green sea, hot blue pools.',
    rumor: 'An island that steams. The springs are hot, the sea is cold, and the fish live in the line between.',
    keeper: { name: 'Sigrún', lines: ['"The hot water keeps the shop warm. The cold water keeps the fish honest."', '"Lumpy green things on the shore, spotted monsters in the deep, and a long blue thing in the cold hole that is older than anyone\'s grandmother."', '"When the geyser goes off, something in the bay answers. We have never seen it. We have heard it."'] },

    hunt: { kind: 'tundra', name: 'the lava moss', gate: 'a cairn-marked path over the lava' }, spots: [{ id: 'strand', kind: 'shore', name: 'The Black Strand', known: 'Black sand under steam. Lumpy green clingers and small spined things, and once in a while a star-backed skate.', fish: { lumpsuckergeyser: 1.8, stickleback: 1.2, lemonsole: .8, starryray: 1.4, roughdab: 1.4 } }, { id: 'springs', kind: 'hotspring', name: 'The Hot Springs', known: 'Where the hot water meets the sea and the fish come to warm up. Spotted heads in the warm, small silver in the cold.', fish: { stickleback: 1.8, spottedwolffish: 1, thescald: 1, char: 1.8 } }, { id: 'hole', kind: 'deep', name: 'The Cold Hole', known: 'Black, cold, bottomless. Something long and blue lies in it and comes up slower than the tide.', fish: { blueling: 1.8, spottedwolffish: .8, starryray: 1.2, roughdab: .6 } }, { id: 'bay', kind: 'lagoon', name: 'Geyser Bay', known: 'Still water that steams on cold mornings. Flat things in the sand and a wolf-headed shape under the ledge.', fish: { lumpsuckergeyser: 1, spottedwolffish: 1.6, lemonsole: 1.8, roughdab: 1.4 } }, { id: 'open', kind: 'open', boat: true, name: 'The Grey Sound', known: 'The sound from your own boat, steam behind you. The long blue ones rise here at night and the sound answers the geyser.', fish: { blueling: 1, starryray: .8, char: 1.2, stickleback: .5, roughdab: .5, lumpsuckergeyser: .5 } }] },
  { id: 'salmonrun', name: 'Grandmother River', title: 'Salmon River', range: 4, shop: true, sell: true, x: 44, y: 44, links: ['monastery', 'whaling', 'ribcage', 'geyser', 'rookery', 'caviar'],

    keeper: { name: 'Ada Qalik', lines: ['"The run comes, the bears come, the buyers come. You came. Everybody eats."', '"Red backs in the shallows, silver in the pools, spotted in the side creeks, and a mother in the deep that never went to sea."', '"Do not fish the bar at dusk. It is not yours at dusk."'] },
    scene: { shore: 'rock', floor: [[120, 120, 110], [40, 56, 60]], far: 'mountains', props: [['pine', .08], ['crate', .3], ['net', .5], ['sled', .7], ['pine', .92]], particles: 'none' },

    hunt: { kind: 'woods', name: 'the spruce bank', gate: 'a trail marked with claw scores' }, spots: [{ id: 'shallows', kind: 'river', name: 'The Spawning Shallows', known: 'Gravel and red backs, so thick the water moves. Humped shapes dig in it and spotted ones steal behind them.', fish: { sockeye: 1.8, dollyvarden: 1, coho: 1, chumsalmon: 1.6 } }, { id: 'pool', kind: 'river', name: 'The Silver Pool', known: 'Deep and green below the rapids. Bright chrome shapes hold in it fresh from the sea, and heavy ones rest on the bottom.', fish: { sockeye: 1, chinook: 1.6, steelhead: 1.8, coho: 1.6 } }, { id: 'creek', kind: 'river', name: 'Bear Creek', known: 'A spotted side stream the bears like. Char colours and the odd suckermouth, and claw marks on every log.', fish: { dollyvarden: 1.8, longnosesucker: 1.8 } }, { id: 'deep', kind: 'lake', name: 'The Grandmother Hole', known: 'The deepest pool of the river. One fish never went to sea, and it lives here, and it is very large.', fish: { chinook: .8, longnosesucker: 1, grandmother: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'The River Mouth', known: 'The estuary from your own boat. Everything in the run passes under you, and the biggest kings come in on the tide.', fish: { sockeye: 1.2, chinook: 1.8, steelhead: 1, coho: 1, chumsalmon: 1.2, longnosesucker: .5 } }] },
  { id: 'throat', name: 'The Throat', title: 'Sunken Volcano', range: 5, shop: true, sell: true, x: 112, y: 34, links: ['crater', 'glass', 'trench', 'steppe', 'starfall', 'city'],

    keeper: { name: 'Ferrau', exotic: true, lines: ['"The hole breathes in at dusk and out at dawn. Fish the out-breath. Everything comes up with it."', '"Pale things from the dark, warm things from the vents, and a swallowing thing that goes back down with whatever it caught."', '"Drop a stone in the hole. Count. Give up counting."'] },
    scene: { shore: 'rock', floor: [[30, 30, 36], [60, 20, 20]], far: 'volcano', props: [['vent', .1], ['obsidian', .3], ['crate', .5], ['vent', .7], ['obsidian', .9]], particles: 'ash', tint: 'rgba(0,40,80,0.12)' },

    hunt: { kind: 'lavafield', name: 'the crater rim', gate: 'a notch in the black rim' }, spots: [{ id: 'rim', kind: 'lagoon', name: 'The Warm Rim', known: 'Bath-warm shallows over black sand. Small bright vent-dwellers and a plumed thing that waves in the current.', fish: { ventgoby: 1.8, plumefish: 1.6 } }, { id: 'vents', kind: 'hotspring', name: 'The Vents', known: 'Where the lagoon floor smokes. Heat-loving shapes with soft mouths, and the pale ones come up to feed on them.', fish: { ventgoby: 1.6, plumefish: 1.2, risingeel: 1 } }, { id: 'hole', kind: 'deep', name: 'The Hole', known: 'The centre. Blue, then black. The up-breath at dawn brings pale eyeless things, and the swallower comes behind them.', fish: { ventgoby: .6, coughfish: 1, gulletgrouper: 1.2, risingeel: 1.8, blackwaterbream: 1.6, eyelesscod: 1.8, theswallow: 1 } }, { id: 'ledge', kind: 'reef', name: 'The Inner Ledge', known: 'A shelf of old lava halfway down. Coughing fish and gullet-mouths rest on it between breaths of the hole.', fish: { ventgoby: .8, coughfish: 1.8, gulletgrouper: 1.6, blackwaterbream: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'Over the Hole', known: 'The centre of the lagoon from your own boat, the hole breathing under you. Everything from the dark passes through here at dawn.', fish: { plumefish: .6, risingeel: 1.2, blackwaterbream: 1, eyelesscod: .8, ventgoby: .5, coughfish: .5 } }] },
  { id: 'mirage', name: 'The Shimmer', title: 'Mirage Flats', range: 5, shop: true, sell: true, x: 226, y: 120, links: ['deadsea', 'coral', 'witch', 'ferry'],

    keeper: { name: 'Nour of the Well', exotic: true, lines: ['"You do not fish the water here. There is no water. You fish where the water would be, and something answers."', '"Shimmering things that are not there until the hook is in. Then they are very there."', '"At noon a whole sea stands on the flats, with a ship on it. Do not sail for the ship."'] },

    hunt: { kind: 'saltflat', name: 'the glass flats', gate: 'two cairns and a line of footprints' }, spots: [{ id: 'haze', kind: 'saltflat', name: 'The Haze', known: 'Sand that ripples like water. Things flicker in it that are not there until the hook sets.', fish: { hazefish: 1.8, mirageminnow: 1.6, heatwrasse: 1, shimmerbream: .8 } }, { id: 'lake', kind: 'lake', name: 'The Lake That Is Not', known: 'A sheet of blue at noon, gone when you reach it. Fish it anyway. Something in it is thirsty.', fish: { hazefish: 1.2, shimmerbream: 1.8, quiverpike: 1.6, morganaflounder: .8, thirstfish: .6 } }, { id: 'dune', kind: 'shore', name: 'The Glass Dune', known: 'Fused sand, hot to touch. Flat shapes swim under the surface like under ice.', fish: { mirageminnow: 1.4, heatwrasse: 1.8, morganaflounder: 1.8 } }, { id: 'well', kind: 'pond', name: 'The Well', known: 'The only real water, deep in a stone shaft. Real fish, very old, and one that comes up when the mirage sea stands.', fish: { mirageminnow: 1, thirstfish: 1.8, wellcarp: 1.8, fatamorgana: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'The Standing Sea', known: 'At noon a whole sea stands on the flats and you sail it. The ship on it is not a ship. The fish are fish.', fish: { hazefish: 1, shimmerbream: 1.2, quiverpike: 1.4, mirageminnow: .5, heatwrasse: .5 } }] },
  { id: 'ink', name: 'The Blot', title: 'Ink Island', range: 5, shop: true, sell: true, x: 16, y: 74, links: ['monastery', 'lazaret', 'tortoise', 'rookery', 'caviar'],

  { id: 'amber', name: 'The Honey Shallows', title: 'Amber Island', range: 5, shop: true, sell: true, x: 146, y: 96, links: ['tidal', 'delta', 'bell', 'biolum', 'sleeper', 'lookingglass'],

  { id: 'runoff', name: 'The Runoff', title: 'Blighted Island', range: 6, shop: true, sell: true, x: 196, y: 40, links: ['hollow', 'clockwork', 'thunder', 'hanging', 'sporewood', 'hourglass'],

  { id: 'hanging', name: 'The Hanging Isle', title: 'Upside-down Island', range: 6, shop: true, sell: true, x: 200, y: 74, links: ['hollow', 'bell', 'deadsea', 'runoff', 'sporewood', 'belly'],

    rumor: 'An island hanging from the sky. The people walk on the underside and fish upward. Do not look down. There is no down.',
    keeper: { name: 'Keel Harrow', exotic: true, lines: ['"Mind the drop. It goes both ways."', '"Things fall out of the cloud: rain fish, hail fish, a pike that rides the updraft. Catch them before they land, or after."', '"The island has a keel, like a ship. It is alive. It is the only reason we have not fallen."'] },

    hunt: { kind: 'cloud', name: 'the cloud roots', gate: 'a rope ladder down into the cloud' }, spots: [{ id: 'drop', kind: 'deep', name: 'The Drop', known: 'Open sky-water under the island, bottomless in both directions. Things fall through it and some of them swim.', fish: { dropfish: 1.8, rainbream: 1.2, cumulusgrouper: 1, updraftpike: 1.6, thekeel: 1 } }, { id: 'pool', kind: 'lake', name: 'The Pool That Hangs', known: 'A lake held upside down in the roots. Nimbus-coloured carp and rain-bright small fry.', fish: { nimbuscarp: 1.8, rainbream: 1.6, hailgoby: 1 } }, { id: 'roots', kind: 'rocks', name: 'The Root Shelf', known: 'Where the island\'s roots come down out of the cloud. Hail-grey things cling to them and a stratus shape slides between.', fish: { dropfish: 1, nimbuscarp: .8, stratuseel: 1.8, hailgoby: 1.8 } }, { id: 'cave', kind: 'cave', name: 'The Hollow Cloud', known: 'A cave in the cloud itself. Soft, wet, and full of things with no idea which way is up.', fish: { dropfish: 1, rainbream: 1, stratuseel: 1.2, cumulusgrouper: 1.6 } }, { id: 'open', kind: 'open', boat: true, name: 'The Sky Sea', known: 'The water above and below, from a boat that is not sure which it is on. The updraft pike run here and the Keel passes beneath.', fish: { nimbuscarp: .8, cumulusgrouper: 1, updraftpike: 1.8, hailgoby: .5, rainbream: .5, dropfish: .5 } }] },
  { id: 'folio', name: 'The Folio', title: 'Paper Island', range: 6, shop: true, sell: true, x: 28, y: 172, links: ['frogs', 'brine', 'whirlpool', 'bayou', 'flamingo'],

    keeper: { name: 'The Underlibrarian', exotic: true, lines: ['"Quiet, please. The fish are reading."', '"Folded things in the reeds, vellum in the stacks, and in the deep a fish that ends every book on the island."', '"If a fish you catch has writing on it, bring it to me before you sell it. Some of them are overdue."'] },

  { id: 'starfall', name: 'Starfall', title: 'Meteor Crater', range: 6, shop: true, sell: true, x: 150, y: 8, links: ['crater', 'thunder', 'glass', 'throat', 'furnace', 'hourglass'],

    rumor: 'A round lake where a star came down. The fish in it shine, and the people there talk about the sky the way others talk about the sea.',
    keeper: { name: 'Orrin Vane', exotic: true, lines: ['"It fell before anyone was here to see it. We have been looking up for it ever since."', '"Comet-tailed things in the shallows, iron things on the bottom, and in the middle whatever came down with the star."', '"On clear nights you can see where it came from. On clearer nights you can see something coming back."'] },

        hunt: { kind: 'woods', name: 'the cedar forest', gate: 'a carved pole with a bear at the bottom' }, spots: [{ id: 'rivermouth', kind: 'river', name: 'The River Mouth', known: 'Where the river comes out silver. Candle-fish in the spring, herring in the fall, eagles all year.', fish: { eulachon: 1.8, pacificherring: 1.4, starryflounder: .8 } }, { id: 'rocks', kind: 'rocks', name: 'The Deep Rocks', known: 'Cold black rock going down. Orange-eyed ancients and bull-headed lurkers hold the ledges.', fish: { pacificherring: .8, yelloweye: 1.8, oldcedar: 1, lingcod: 1.8, cabezon: 1.4 } }, { id: 'point', kind: 'deep', name: 'Off Raven Point', known: 'Where the kings run and something with their own teeth runs them. Big skates on the sand below.', fish: { pacificherring: 1, bigskate: 1.6, salmonshark: 1.6, lingcod: 1 } }, { id: 'flats', kind: 'flats', name: 'The Clam Flats', known: 'Grey sand at low tide. Starry flat things and small herring in the pools, ravens working the edge.', fish: { eulachon: 1, pacificherring: 1.6, starryflounder: 1.8, cabezon: 1.2 } }, { id: 'open', kind: 'open', boat: true, name: 'The Sound', known: 'Cold green water from a canoe with eyes on it. Kings pass under and the salmon-shark passes under them.', fish: { pacificherring: 1.4, bigskate: 1, salmonshark: 1.4, eulachon: .5, starryflounder: .5 } }] },
  { id: 'caviar', name: 'Caviar Bank', title: 'Sturgeon Coast', range: 4, shop: true, sell: true, x: 34, y: 62, links: ['reach', 'monastery', 'salmonrun', 'ink', 'forest'],
        blurb: 'A grey inland sea, reed beds to the horizon, and fishers who take the roe and let the fish go on, mostly.', vibe: 'Grey water, grey sky, reeds, a long wooden pier, tins of black roe stacked like gold, and fish older than the pier.',
        rumor: 'A grey sea with no tide, full of fish that were old when the pier was new. They pay for the eggs. They pay a great deal.',
        keeper: { name: 'Grigor Ashot', lines: ['"The eggs are worth more than the fish and the fish is worth more than you. Be careful on the pier."', '"Sterlets in the reeds, shad in the shallows, and in the deep bank a grandfather older than the empire."', '"We take the roe and put the fish back. Mostly. The grandfather remembers the ones we did not."'] },

        hunt: { kind: 'reeds', name: 'the reed sea', gate: 'a punt in the reeds' }, spots: [{ id: 'reeds', kind: 'marsh', name: 'The Reed Edge', known: 'Reeds into grey water. Small spiny-backed sturgeon shapes and a copper-flanked bream.', fish: { sterlet: 1.8, kutum: 1.6, fenbream: 1.6 } }, { id: 'shallows', kind: 'flats', name: 'The Shad Shallows', known: 'Sand and shoals. Shad in silver sheets and quick asp-shaped hunters behind them.', fish: { kutum: 1, caspianshad: 1.8, asp: 1.8 } }, { id: 'bank', kind: 'deep', name: 'The Deep Bank', known: 'Where the grey goes down. The grandfather lives here, and the pike-perch that are not afraid of him.', fish: { beluga: 1.8, kutum: .6, asp: .8, russiansturgeon: 1.6, grandfatherbeluga: 1, zander: 1.6 } }, { id: 'pier', kind: 'pier', name: 'The Long Pier', known: 'A pier out to nowhere. Everything passes under it at some hour. Roe-tins rust on the posts.', fish: { sterlet: 1.2, kutum: 1.2, caspianshad: 1, russiansturgeon: .8, zander: 1.2, fenbream: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'The Grey Sea', known: 'The tideless sea from your own boat. Sturgeon of every age cruise it and the grandfather comes up once a year.', fish: { beluga: 1, sterlet: .8, caspianshad: 1.4, asp: 1, russiansturgeon: 1.2, zander: 1, kutum: .5 } }] },
  { id: 'city', name: 'Rooftop City', title: 'Flooded City', range: 4, shop: true, sell: true, x: 126, y: 46, links: ['throat', 'glass', 'sleeper', 'steppe', 'furnace'],
        blurb: 'A city the monsoon never left, fished from its own rooftops, with the streets become canals and the temples become reefs.', vibe: 'Rooftops for islands, washing lines over the canals, boats where the buses were, a market on a bridge, fish in the second-floor windows.',
        rumor: 'A city that flooded and decided to stay that way. They fish from the roofs. The fish live in the shops.',
        keeper: { name: 'Auntie Lan of the Fourth Floor', lines: ['"My shop was on the ground floor. Then the first. Now the fourth. The fish followed me up every time."', '"Silver jumpers in the main canal, giant gouramis in the cinema, black carp in the bank vault, and a landlord in the temple who collects."', '"Do not fish the courthouse. The fish there have lawyers."'] },

        hunt: { kind: 'reeds', name: 'the overgrown park', gate: 'a turnstile under the water line' }, spots: [{ id: 'canal', kind: 'channel', name: 'The Main Canal', known: 'The high street, two fathoms down. Silver carp jump at the boats and a yellow whiskered thing sulks under the bus.', fish: { silvercarp: 1.8, blackcarp: .6, wuchangbream: 1, yellowcatfish: 1.6, snakehead: 1.4, tilapia: 1.2, grasscarp: 1.4 } }, { id: 'cinema', kind: 'cave', name: 'The Cinema', known: 'A drowned hall, dark and warm. Giant gouramis breathe at the surface and small bream graze the seats.', fish: { kissinggourami: 1.8, wuchangbream: 1.6, courthouseeel: 1.2, snakehead: 1.2, tilapia: 1 } }, { id: 'vault', kind: 'deep', name: 'The Bank Vault', known: 'Deep water behind a steel door that never shut. Black carp as long as a man and the landlord, when he comes to collect.', fish: { kissinggourami: .8, blackcarp: 1.8, courthouseeel: 1.4, thelandlord: 1, snakehead: .8, grasscarp: 1 } }, { id: 'market', kind: 'pier', name: 'The Bridge Market', known: 'Where the stalls are now. Scraps go over the rail all day and everything comes to eat them.', fish: { silvercarp: .8, wuchangbream: 1.4, yellowcatfish: 1.4, tilapia: 1.8 } }, { id: 'open', kind: 'open', boat: true, name: 'The Drowned Boulevard', known: 'The widest street from your own boat, rooftops either side. The big jumpers run here and the landlord does his rounds.', fish: { silvercarp: 1.8, grasscarp: 1.2, wuchangbream: .5, yellowcatfish: .5 } }] },
  { id: 'furnace', name: 'The Furnace', title: 'Glassblowers\' Island', range: 5, shop: true, sell: true, x: 162, y: 22, links: ['starfall', 'thunder', 'glass', 'city'],
        blurb: 'An island of kilns where the fish are blown from glass, cooled in the sea, and swim off before they are finished.', vibe: 'Chimneys that never go out, sand that is half glass, blowers at the pipes, and fish that chime when they turn.',
        rumor: 'Kilns on a black beach. They blow fish from glass and the fish swim away. You can hear them in the surf like bells.',
        keeper: { name: 'Master Vitro', exotic: true, lines: ['"Every fish in that water came off a pipe. Some of them came off mine. Be gentle with those."', '"Bubbles in the shallows, stems in the kelp, goblets on the reef. The deep has the cullet: the ones that broke and kept going."', '"My master blew one last piece before he died and it went into the sea unsigned. I would know it anywhere. I have never seen it."'] },

        hunt: { kind: 'glass', name: 'the cullet field', gate: 'a gate of fused bottles' }, spots: [{ id: 'shallows', kind: 'shore', name: 'The Cooling Shallows', known: 'Where the pipes are quenched. Bubble-bodied small things, still warm, and stemmed shapes that ring.', fish: { bubblefish: 1.8, stemgoby: 1.6, moltengar: .6, frostedsole: 1.4 } }, { id: 'reef', kind: 'reef', name: 'The Goblet Reef', known: 'Blown glass grown into coral. Goblet-shaped bream and long clear eels you see only by their shadows.', fish: { bubblefish: .8, stemgoby: 1.4, gobletbream: 1.8, cleareel: 1.6 } }, { id: 'deep', kind: 'deep', name: 'The Cullet', known: 'Where the broken pieces went. Jagged shapes that still swim, and the master\'s last piece, unsigned.', fish: { gobletbream: .8, culletfish: 1.8, frostedsole: 1.2, lastpiece: 1 } }, { id: 'kiln', kind: 'hotspring', name: 'The Kiln Outflow', known: 'Hot water from the furnaces. Molten-coloured things that have not set yet.', fish: { bubblefish: 1.2, moltengar: 1.8 } }, { id: 'open', kind: 'open', boat: true, name: 'The Annealing Sea', known: 'Open water from your own boat, chiming. Half-finished shapes drift here cooling, and the last piece turns below.', fish: { gobletbream: 1, cleareel: 1.2, culletfish: 1, frostedsole: .8, bubblefish: .5, stemgoby: .5 } }] },
  { id: 'lookingglass', name: 'The Looking Glass', title: 'Mirror Sea', range: 5, shop: true, sell: true, x: 146, y: 76, links: ['sleeper', 'amber', 'stormeye', 'bell'],
        blurb: 'A sea so still it is a mirror, and the fish in it are the reflections of fish that are not there.', vibe: 'Water like polished silver, your own face under the boat, a village that builds everything twice, one of each upside down.',
        rumor: 'A sea you can see yourself in. The fish are reflections of fish. Catch one and the sky has one less.',
        keeper: { name: 'Both Imrie', exotic: true, lines: ['"There are two of me. The other one runs the other shop. We do not get on."', '"Reflection perch in the shallows, backwards eels in the deep, and a pike that is always two pikes."', '"Do not look at your reflection too long. It looks back longer. It has had practice."'] },
    scene: { shore: 'glass', floor: [[160, 170, 180], [120, 130, 150]], far: 'island', props: [['crystal', .1], ['sign', .3], ['crate', .5], ['crystal', .7], ['lantern', .9]], particles: 'sparkle', tint: 'rgba(220,230,255,0.14)' },
        village: { kind: 'glasshouse', props: [['crystal', .08], ['sign', .3], ['barrel', .72], ['crystal', .92]] },
        hunt: { kind: 'saltflat', name: 'the silvered flats', gate: 'two cairns that are one cairn' }, spots: [{ id: 'shallows', kind: 'lagoon', name: 'The Shallows', known: 'So still it hurts. Perch-shaped reflections and small other-coloured bream, swimming wrong way up.', fish: { reflectionperch: 1.8, otherbream: 1.6, realherring: .6, vanitybass: 1 } }, { id: 'deep', kind: 'deep', name: 'The Deep Reflection', known: 'The sky, going down. Backwards eels and a ray made of silvering.', fish: { otherbream: .8, backwardseel: 1.8, silveringray: 1.6 } }, { id: 'edge', kind: 'shore', name: 'The Frame', known: 'Where the mirror meets the land. Twinned pike, always two, never one.', fish: { reflectionperch: 1, twinpike: 1.8, vanitybass: 1.4 } }, { id: 'crack', kind: 'cave', name: 'The Crack', known: 'A flaw in the mirror where the real sea shows through. Real fish, confused, and the other you.', fish: { reflectionperch: .8, backwardseel: 1, realherring: 1.8, theotheryou: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'The Glass', known: 'The mirror itself from your own boat, your double under the hull. The twin pike run here and the other you waits.', fish: { otherbream: 1, twinpike: 1.6, silveringray: 1, realherring: .8, vanitybass: 1.2, reflectionperch: .5 } }] },
  { id: 'sporewood', name: 'Sporewood', title: 'Mushroom Island', range: 5, shop: true, sell: true, x: 180, y: 52, links: ['runoff', 'stormeye', 'hanging', 'hollow'],
        blurb: 'Mushrooms the size of houses, a village living under their caps, and fish that grow on gills instead of having them.', vibe: 'Caps like roofs, stalks like towers, spores drifting in every shaft of light, a smell of earth and bread, people who never see the sun.',
        rumor: 'An island of mushrooms taller than ships. The people live under the caps. The fish are fruiting bodies with fins.',
        keeper: { name: 'Mycel', exotic: true, lines: ['"Everything here is one thing, underneath. The fish, the caps, the shop, me. You are the only separate thing on the island. Enjoy it."', '"Cap-fish in the pools, puffballs in the gill-water, truffles under the mud. Morels come up after rain."', '"Once a year the whole island fruits at once and a fish comes up that is the island. We do not catch it. It would be rude."'] },
    scene: { shore: 'cave', floor: [[90, 70, 50], [40, 30, 20]], far: 'none', props: [['glowshroom', .08], ['glowshroom', .26], ['crate', .48], ['glowshroom', .7], ['stalagmite', .9]], particles: 'spores', weather: 'cave', tint: 'rgba(120,80,40,0.14)' },
        village: { kind: 'cavehut', props: [['glowshroom', .08], ['sacks', .3], ['barrel', .72], ['glowshroom', .92]] },
        hunt: { kind: 'cave', name: 'the undercap', gate: 'a doorway cut into a stalk' }, spots: [{ id: 'pools', kind: 'pond', name: 'The Cap Pools', known: 'Rainwater in the dents of a cap. Cap-fish and morel-headed small things, soft and warm.', fish: { capfish: 1.8, puffballpuffer: 1, morelgoby: 1.6, rainmorel: 1.8 } }, { id: 'gill', kind: 'lagoon', name: 'The Gill Water', known: 'Under the biggest cap, between the gills. Puffball puffers and a trout that tastes of truffle.', fish: { capfish: 1, gillbream: 1.2, puffballpuffer: 1.8, truffletrout: 1.6 } }, { id: 'mud', kind: 'deep', name: 'The Mycelium', known: 'Black water over the root-mat that is the island. Pale mycelium eels and whatever the island is growing.', fish: { myceliumeel: 1.8, morelgoby: 1.2, truffletrout: 1, fruitingbody: 1 } }, { id: 'stalk', kind: 'cave', name: 'Inside the Stalk', known: 'Hollow and dripping. Spore-fed gill-bream and nothing with eyes.', fish: { gillbream: 1.8, myceliumeel: 1 } }, { id: 'open', kind: 'open', boat: true, name: 'Under the Caps', known: 'Poling between the stalks in your own boat, spores in the light. The fruiting body rises here once a year.', fish: { capfish: .8, truffletrout: 1, morelgoby: .5, gillbream: .5 } }] },
  { id: 'belly', name: 'The Belly', title: 'Inside a Whale', range: 6, shop: true, sell: true, x: 232, y: 68, links: ['hollow', 'deadsea', 'hanging'],
        blurb: 'Not an island: the inside of something that swallowed one. Ribs for a sky, a lake of what it drank, a village of the swallowed.', vibe: 'Ribs overhead, a wet red light, a lake that heaves when it breathes, boats made of what came in with the tide, people who stopped waiting to be spat out.',
        rumor: 'A place with ribs for a roof and a tide that breathes. Everything in it was swallowed. Everything in it is still alive.',
        keeper: { name: 'Jonas the Swallowed', exotic: true, lines: ['"I came in on a Tuesday. I have been here nine years. The shop was a lifeboat. Now it is a shop."', '"Undigested herring in the shallows, gastric eels in the deep, krill-kings under the ribs. Nothing in here has finished dying."', '"Something was swallowed before any of us and it has grown. When it moves, the whole belly moves. We call it the first course."'] },

  { id: 'ferry', name: 'The Last Ferry', title: 'Ferry of the Dead', range: 6, shop: true, sell: true, x: 198, y: 170, links: ['witch', 'pirate', 'mirage'],
        blurb: 'A black dock on a black shore where a ferry calls at night and nobody who boards it fishes again.', vibe: 'A dock of black wood, a lantern that burns green, a bell with no rope, a ticket office, and a queue that does not talk.',

  { id: 'hourglass', name: 'The Hourglass', title: 'Hourglass Island', range: 6, shop: true, sell: true, x: 212, y: 18, links: ['clockwork', 'runoff', 'starfall'],
        blurb: 'Two bowls of sand joined at a waist, and in the lower bowl time runs the other way.', vibe: 'A sand island shaped like an hourglass, a channel at the waist where the sand pours up, a village that is young on one side and old on the other.',

// ---------- ticking ----------
let lastPhase = null;
function tick() {
  if (MODE === 'title' || MODE === 'cut') return;

  S.lines.forEach((L, i) => {
    if (!L) return;
    if (L.phase === 'waiting' && t >= L.at) {
      if (!L.c) { L.phase = 'idle'; toast(`Line ${i + 1}: nothing's biting on that.`); changed = true; return; }
      if (L.rig === 'hand') { L.phase = 'bite'; L.exp = L.at + hitWindowFor(SP[L.c.id]); S.sel = i; toast(`HIT on line ${i + 1}!`); }
      else { L.phase = 'hooked'; toast(`Line ${i + 1}: something's on.`); }

    }

  if (changed) { save(); render(); renderIsle(); return; }

  $('#hClock').textContent = (S.prologue ? '' : islandLabel(loc()) + ' · ' + spot().name + ' · ') + clockText(t);

}

// What the water says, without saying what is in it: read from the pool's shape, not its names.

function drawMinis(el) {
  el.querySelectorAll('canvas.mini.game').forEach(c => { const x = c.getContext('2d'); x.fillStyle = '#1e2a1c'; x.fillRect(0, 0, 80, 48); x.fillStyle = '#2c3a28'; x.fillRect(0, 44, 80, 4); const bc = beastC(c.dataset.game, 1, c.dataset.known === '0' ? 'dim' : 'color'); x.drawImage(bc, (80 - bc.width) >> 1, 44 - bc.height); });
  el.querySelectorAll('canvas.mini:not(.game)').forEach(c => { const x = c.getContext('2d'); x.fillStyle = '#0f2238'; x.fillRect(0, 0, 64, 36); x.fillStyle = '#152638'; x.fillRect(0, 34, 64, 2); blitFishCentered(x, c.dataset.fish, 32, 17, 1, c.dataset.known === '1' ? (c.dataset.v || 'color') : 'dim'); });
}
// visited: full ink. known: named by rumor. fog: next to somewhere visited, drawn as ???. hidden: not on the chart yet.
function mapState(l) {
  if (l.id === 'sea') return 'hidden';
  if (S.visited[l.id]) return 'visited';
  if (S.known[l.id]) return 'known';
  if (l.links.some(k => S.visited[k])) return 'fog';
  return 'hidden';
}
function mapClick(e) {
  const c = e.currentTarget, r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * MW, y = (e.clientY - r.top) / r.height * MH;
  let best = null, bd = 16;
  for (const l of LOCS) { if (mapState(l) === 'hidden') continue; const d = Math.hypot(l.x - x, l.y - y); if (d < bd) { bd = d; best = l; } }
  if (best) { mapSel = best.id; renderSheet(); }
}

// ---------- input ----------
document.addEventListener('click', e => {

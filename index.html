<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Castaway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: the pixel scene is a fixed canvas filling the viewport. Everything else floats over it:
   a HUD strip at the top, open sky and water in the middle, a translucent control panel at the bottom.
   Title and cutscene screens are full-viewport overlays on the same canvas.
   Single theme on purpose: tar, brass and lantern light. */
:root{
  --ink:#0a1020;
  --panel:rgba(11,17,34,.86);
  --panel-solid:#141f38;
  --panel-2:#20325a;
  --edge:#3a5080;
  --text:#ece6d6;
  --muted:#a3aec6;
  --brass:#f0c050;
  --brass-2:#b8871c;
  --brass-3:#5e440a;
  --good:#8ad48a;
  --bad:#e27b5f;
  --display:'Press Start 2P','VT323',monospace;
  --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--ink);color:var(--text);font-family:var(--body);font-size:20px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:linear-gradient(rgba(10,16,32,.8),rgba(10,16,32,0))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#scene{position:fixed;left:0;top:0;z-index:0;pointer-events:none}
#fade{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .55s}
#fade.on{opacity:1;pointer-events:auto}
.screen{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:14px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(44px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#title .logo{font-family:var(--display);font-size:clamp(26px,8.5vw,44px);color:var(--brass);letter-spacing:2px;text-align:center;
  text-shadow:3px 3px 0 #2b1d05,6px 6px 0 rgba(0,0,0,.35)}
#title .tagline{font-size:23px;text-shadow:2px 2px 0 #0a1020;color:var(--text)}
#title .menu{display:grid;gap:10px;width:min(100%,300px);margin-top:14px}
#title .vers{color:var(--muted);font-size:17px;text-shadow:1px 1px 0 #0a1020}
#title .confirm{color:var(--bad);font-size:18px;text-shadow:1px 1px 0 #0a1020;min-height:1.2em;text-align:center}
#cut{cursor:pointer;gap:10px}
#cut .cap{font-family:var(--display);font-size:clamp(11px,3.4vw,15px);line-height:1.9;color:var(--text);text-align:center;text-wrap:balance;
  text-shadow:2px 2px 0 #0a1020;max-width:440px;min-height:3.8em;opacity:0;transition:opacity .6s}
#cut .cap.show{opacity:1}
#cut .hint{color:var(--muted);font-size:18px;text-shadow:1px 1px 0 #0a1020}
#cut .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#game{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto}
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;gap:8px;padding:12px 0 14px;
  background:linear-gradient(rgba(10,16,32,.82),rgba(10,16,32,.5) 65%,rgba(10,16,32,0))}
#hud .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud .loc{font-family:var(--display);font-size:12px;color:var(--brass);text-wrap:balance;text-shadow:2px 2px 0 #0a1020}
#hud .sub{color:var(--text);font-size:18px;margin-top:5px;font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 #0a1020}
#hud .right{text-align:right}
#hud .money{font-family:var(--display);font-size:12px;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #0a1020}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font-family:var(--display);font-size:9px;padding:9px 4px;background:rgba(11,17,34,.72);border:2px solid var(--edge);color:var(--text)}
.tabs button.pulse{border-color:var(--brass);color:var(--brass)}
.spacer{flex:1;min-height:33vh}
#panel{background:var(--panel);border:2px solid var(--edge);border-bottom:0;border-top-color:rgba(240,192,80,.55);
  padding:9px 10px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.tide{font-size:17px;color:var(--muted);text-align:center;text-wrap:balance;padding:0 2px}
.tide b{color:var(--text);font-weight:normal}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{width:100%;background:rgba(10,16,32,.55);border:2px solid var(--edge);padding:8px 3px 6px;display:grid;gap:4px;min-width:0;text-align:center}
.slot .n{font-family:var(--display);font-size:8px;color:var(--muted)}
.slot .st{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel{border-color:var(--brass);background:var(--panel-2)}
.slot.sel .n{color:var(--brass)}
.slot.on .st{color:var(--brass)}
.slot.hot{border-color:var(--bad)}
.slot.hot .st{color:var(--bad)}
.slot.lock{border-style:dashed;opacity:.55}
.box{display:grid;gap:7px}
.box h3{margin:0;font-family:var(--display);font-size:9px;color:var(--muted);letter-spacing:.5px}
.lhead{display:flex;justify-content:space-between;align-items:baseline}
.lhead h3{margin:0;font-family:var(--display);font-size:9px;color:var(--brass);letter-spacing:.5px}
.lhead .note{font-size:17px}
.rigrow{display:flex;align-items:center;gap:6px;background:rgba(10,16,32,.6);border:2px solid var(--edge);padding:4px 6px}
.rigrow .chip{flex:0 1 auto;min-width:0;padding:6px 6px;background:none;border:2px solid transparent;font-family:var(--display);font-size:9px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rigrow .chip:active{border-color:var(--edge)}
.rigrow .dot{color:var(--muted)}
.rigrow .link{margin-left:auto;flex:none;padding:6px 4px;background:none;border:0;font-family:var(--display);font-size:9px;color:var(--brass)}
.rigrow.open .link{color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bar .tool{display:grid;gap:3px;text-align:left;padding:8px 10px;background:rgba(10,16,32,.6);border:2px solid var(--edge);min-width:0}
.bar .tool .n{font-family:var(--display);font-size:8px;color:var(--muted)}
.bar .tool .v{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bar .tool.sell{border-color:var(--brass-2)}
.bar .tool.sell .n,.bar .tool.sell .v{color:var(--brass)}
.bar .tool[disabled]{opacity:.5;cursor:default}
.bar .tool:only-child{grid-column:1/-1}
.segrow{display:flex;align-items:center;gap:6px}
.segrow .lbl{font-family:var(--display);font-size:8px;color:var(--muted);width:42px;flex:none}
.seg{display:flex;gap:4px;flex:1;min-width:0}
.seg button{flex:1 1 0;min-width:0;padding:7px 3px;background:rgba(10,16,32,.6);border:2px solid var(--edge);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sel{border-color:var(--brass);color:var(--brass);background:var(--panel-2)}
.seg button[disabled]{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:17px}
.cta{font-family:var(--display);font-size:13px;padding:15px 10px;background:var(--brass);color:#2b1d05;border:3px solid var(--brass-2);box-shadow:0 4px 0 var(--brass-3);text-transform:uppercase}
.cta:active{transform:translateY(3px);box-shadow:none}
.cta.alt{background:var(--panel-2);color:var(--text);border-color:var(--edge);box-shadow:0 4px 0 #0b1223}
.cta.hit{background:var(--bad);border-color:#a44f36;box-shadow:0 4px 0 #5a2a1c;color:#2a0d05;animation:thump .35s infinite alternate}
.cta[disabled]{opacity:.5;cursor:default;transform:none}
@keyframes thump{from{transform:translateY(0)}to{transform:translateY(2px)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row .name{min-width:0}
.row .name small{display:block;color:var(--muted);font-size:17px}
.row .price{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--brass)}
.buy{font-family:var(--display);font-size:9px;padding:8px 10px;background:var(--panel-2);border:2px solid var(--edge);white-space:nowrap}
.buy[disabled]{opacity:.4;cursor:default}
.list{display:grid;gap:2px}
.list .row{padding:8px 6px;border-bottom:1px solid var(--edge)}
.list .row.dim{opacity:.55}
.list canvas.mini{width:96px;height:auto;flex:none;background:var(--ink);border:1px solid var(--edge)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,8,18,.8);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.center{align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--panel-solid);border:3px solid var(--edge);border-bottom:0;
  padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;align-content:start}
.sheet .head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-family:var(--display);font-size:13px;color:var(--brass)}
.x{font-family:var(--display);font-size:11px;padding:8px 10px;background:var(--panel-2);border:2px solid var(--edge)}
.card{width:100%;max-width:360px;background:var(--panel-solid);border:3px solid var(--brass);padding:14px;display:grid;gap:8px;text-align:center;justify-items:center}
.card h2{margin:0;font-family:var(--display);font-size:13px;color:var(--brass);text-wrap:balance}
.card .big{font-size:22px}
.card .tag{color:var(--good);font-family:var(--display);font-size:9px}
.card canvas{width:144px;height:auto;background:var(--ink);border:2px solid var(--edge)}
.card.catch{max-width:400px;padding:16px 14px;gap:10px;justify-items:stretch}
.catch .head{font-family:var(--display);font-size:clamp(20px,7vw,30px);color:var(--brass);text-shadow:3px 3px 0 #2b1d05;line-height:1.2}
.catch .pill{justify-self:center;font-family:var(--display);font-size:8px;padding:6px 10px;background:#2a5a74;color:var(--text);letter-spacing:.5px}
.catch .pill.gold{background:var(--brass-2);color:#2b1d05}
.catch .pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.catch canvas.art{width:100%;max-width:300px;justify-self:center;border:2px solid var(--edge)}
.catch .fish{font-family:var(--display);font-size:13px;color:var(--text);text-wrap:balance}
.catch .size{display:flex;justify-content:center;align-items:baseline;gap:10px;font-family:var(--display);font-size:clamp(14px,5.2vw,24px);color:var(--brass);text-shadow:3px 3px 0 #2b1d05}
.catch .size span{white-space:nowrap}
.catch .size .sep{color:var(--brass-2);text-shadow:none}
.catch .sub{color:var(--muted);font-size:18px}
.catch .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:left}
.catch .stat{background:rgba(10,16,32,.6);border:2px solid var(--edge);padding:8px 8px}
.catch .stat .n{font-family:var(--display);font-size:8px;color:var(--brass)}
.catch .stat .v{font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catch .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catch .acts .cta:only-child{grid-column:1/-1}
.catch .warn{color:var(--bad);font-size:17px}
.fightbox{width:100%;max-width:380px;display:grid;gap:8px;justify-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.fightbox canvas{width:min(100%,300px);height:auto;border:3px solid var(--edge)}
.fightbox .fname{font-family:var(--display);font-size:12px;color:var(--brass);text-align:center;text-wrap:balance}
.toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:30;padding:0 16px}
.toast{background:var(--panel-2);border:2px solid var(--brass);padding:7px 12px;font-size:19px;max-width:420px;text-align:center}
#mapcv{width:100%;height:auto;border:3px solid #5a4630;background:#d9c8a0}
.legend{display:grid;gap:4px}
.legend button{width:100%;text-align:left;background:none;border:2px solid transparent;padding:6px 6px;color:inherit}
.legend button.sel{border-color:var(--brass);background:var(--panel-2)}
.legend button.dim{opacity:.55}
.legend .here{color:var(--good);font-size:17px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.cta.hit{animation:none}.cta:active{transform:none}}
</style>

<canvas id="scene" width="195" height="375"></canvas>
<div id="fade"></div>

<div class="screen" id="title">
  <div class="logo">CASTAWAY</div>
  <div class="tagline">Fish your way home.</div>
  <div class="menu">
    <button class="cta alt" data-act="continue" id="bCont" hidden>Continue</button>
    <button class="cta" data-act="new" id="bNew">New voyage</button>
  </div>
  <div class="confirm" id="confirm"></div>
  <div class="vers">prototype · everything is placeholder art</div>
</div>

<div class="screen" id="cut" hidden>
  <button class="x skip" data-act="skip">SKIP</button>
  <div class="cap" id="cap"></div>
  <div class="hint">tap to continue</div>
</div>

<div id="game" hidden>
  <header id="hud">
    <div class="top">
      <div><div class="loc" id="hLoc">Wreck Shoal</div><div class="sub" id="hClock">06:00 · Dawn</div></div>
      <div class="right"><div class="money" id="hMoney">$0</div><div class="sub" id="hBucket">Bucket 0/20</div></div>
    </div>
    <nav class="tabs">
      <button data-act="open" data-k="map" id="tMap">Map</button>
      <button data-act="open" data-k="index">Index</button>
      <button data-act="open" data-k="shop" id="tShop" hidden>Shop</button>
      <button data-act="open" data-k="menu">Menu</button>
    </nav>
  </header>
  <div class="spacer"></div>
  <section id="panel">
    <div class="tide" id="tide"></div>
    <div class="lhead"><h3>LINES</h3><div class="note" id="ready"></div></div>
    <div class="slots" id="slots"></div>
    <div class="box" id="action"></div>
    <div id="extra" style="display:grid;gap:8px"></div>
  </section>
</div>

<div class="toasts" id="toasts"></div>
<div class="overlay" id="sheetWrap" hidden><div class="sheet" id="sheet"></div></div>
<div class="overlay center" id="cardWrap" hidden><div class="card" id="card"></div></div>
<div class="overlay center" id="fightWrap" hidden>
  <div class="fightbox">
    <div class="fname" id="fname"></div>
    <canvas id="fcv" width="128" height="128"></canvas>
    <div class="note" style="text-align:center">Hold anywhere to lift the net. Let go to drop it. Keep the fish inside.</div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const now = () => Date.now();
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const pad = n => (n < 10 ? '0' : '') + n;
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const lerpC = (A, B, f) => [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f, A[2] + (B[2] - A[2]) * f];
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;

// ---------- tuning (prototype values; CLAUDE.md says what they stand in for) ----------
const T = {
  hourMs: 60000,                 // 1 real minute = 1 game hour, a 24-minute day
  handWait: [2000, 6000],        // rod: seconds to a bite
  setWait: [40000, 90000],       // set line: hooks in 40-90 s, keeps ticking while you're away
  trophyWait: [150000, 300000],  // trophy line: 2.5-5 min
  hitWindow: 3000,               // ms to tap Reel after a hit
  bucketCap: 20,
  raftWood: 6,
};

// ---------- data ----------
const BAITS = {
  scraps: { name: 'Shell scraps', tier: 0, price: 0 },
  shrimp: { name: 'Shrimp', tier: 1, price: 20, qty: 5 },
  squid:  { name: 'Squid',  tier: 2, price: 60, qty: 5 },
};
const RODS = [
  { id: 'stick',  name: 'Stick rod',  bar: 0.24, price: 0 },
  { id: 'cane',   name: 'Cane rod',   bar: 0.30, price: 250 },
  { id: 'carbon', name: 'Carbon rod', bar: 0.36, price: 900 },
];
const BOATS = [
  { id: 'none',     name: 'No boat',        range: 0, price: 0 },
  { id: 'raft',     name: 'Driftwood raft', range: 1, price: 0 },
  { id: 'skiff',    name: 'Skiff',          range: 2, price: 800 },
  { id: 'cutter',   name: 'Cutter',         range: 3, price: 3500 },
  { id: 'trawler',  name: 'Trawler',        range: 4, price: 12000 },
  { id: 'starship', name: 'Starship',       range: 5, price: 500000, locked: true },
];
const SLOT_PRICES = [0, 0, 150, 450];
const TROPHY_RIG_PRICE = 600;

const LOCS = [
  { id: 'shoal',  name: 'Wreck Shoal',  range: 0, shop: false, sell: false, x: 40,  y: 86, blurb: 'Where you washed up. No market, just a bucket.' },
  { id: 'harbor', name: 'Gull Harbor',  range: 1, shop: true,  sell: true,  x: 92,  y: 80, blurb: 'First port. Buys the whole haul.' },
  { id: 'reach',  name: 'Kelp Reach',   range: 2, shop: false, sell: false, x: 26,  y: 50, blurb: 'Reef and kelp. No market here.' },
  { id: 'trench', name: 'Black Trench', range: 3, shop: false, sell: true,  x: 122, y: 44, blurb: 'Deep water. A buyer boat anchors here.' },
  { id: 'fjord',  name: 'Frost Fjords', range: 4, shop: true,  sell: true,  x: 70,  y: 18, blurb: 'Far north. Ice station with a shop.' },
  { id: 'stars',  name: 'The Stars',    range: 5, shop: false, sell: false, x: 142, y: 10, blurb: 'Not in this build.', locked: true },
];

// beh: smooth | dart | sinker | floater. diff 0-1. shape picks the distant silhouette in the scene. rare = rod or trophy line only.
// Real species, placed by biome. Sizes are real adult ranges in cm; values are untuned guesses.
const SPECIES = [
  // Wreck Shoal: warm shallows around a wreck
  { id: 'sardine',    name: 'Sardine',               loc: { shoal: 40, harbor: 10 }, size: [10, 20],   value: 2,   beh: 'smooth',  diff: 0.10, shape: 'fry' },
  { id: 'bream',      name: 'Gilt-head Bream',       loc: { shoal: 24, harbor: 10 }, size: [20, 50],   value: 7,   beh: 'smooth',  diff: 0.30, shape: 'bream' },
  { id: 'grunt',      name: 'French Grunt',          loc: { shoal: 20 },             size: [15, 30],   value: 5,   beh: 'smooth',  diff: 0.25, shape: 'bream' },
  { id: 'needlefish', name: 'Needlefish',            loc: { shoal: 12 },             size: [40, 90],   value: 8,   beh: 'dart',    diff: 0.45, shape: 'pike', k: 0.003, time: ['day'] },
  { id: 'pompano',    name: 'Florida Pompano',       loc: { shoal: 10 },             size: [25, 55],   value: 14,  beh: 'dart',    diff: 0.50, shape: 'bream', k: 0.02, time: ['dawn', 'dusk'] },
  { id: 'snapper',    name: 'Mangrove Snapper',      loc: { shoal: 12 },             size: [25, 60],   value: 14,  beh: 'sinker',  diff: 0.45, shape: 'bream', time: ['dusk', 'night'], minBait: 1 },

// v3 saves used a fictional roster; these ids map onto their nearest real species.
const ID_MAP_V3 = { minnow: 'sardine', jack: 'yellowtail', eel: 'conger', king: 'sturgeon', rockcod: 'rockfish', dragon: 'sunfish', dory: 'lanternfish', grouper: 'sablefish', leviathan: 'coelacanth', aurora: 'salmon' };
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));
// Weight from length: kg = k × cm³ / 1000, with k a condition factor by body shape (a species can override with `k`).
const K_SHAPE = { fry: 0.009, bream: 0.018, trout: 0.011, pike: 0.006, eel: 0.0025, big: 0.012, flat: 0.013 };
const kgOf = (sp, cm, jit) => Math.round((sp.k || K_SHAPE[sp.shape] || 0.01) * cm * cm * cm / 1000 * (1 + (jit || 0)) * 1000) / 1000;
const fishKg = f => f.kg != null ? f.kg : kgOf(SP[f.id], f.cm, 0);
const fmtKg = kg => kg < 1 ? Math.round(kg * 1000) + ' g' : kg < 10 ? kg.toFixed(1) + ' kg' : Math.round(kg) + ' kg';
const LOC = Object.fromEntries(LOCS.map(l => [l.id, l]));
const PHASE_NAME = { dawn: 'Dawn', day: 'Day', dusk: 'Dusk', night: 'Night' };

// ---------- state ----------
function freshState() {
  return {
    v: 5, started: false, loc: 'shoal', money: 0, bucket: [], wood: 0, raft: false, boat: 'none', rod: 'stick', slots: 2, trophyRig: false,
    pending: null, // a landed catch waiting for Sell / Keep / Release; survives a reload
    bait: { shrimp: 0, squid: 0 },
    lines: [{ rig: 'hand', bait: 'scraps', phase: 'idle' }, { rig: 'set', bait: 'scraps', phase: 'idle' }, null, null],
    sel: 0, index: {}, visited: { shoal: true }, sold: 0, casts: 0,
  };
}
let S = freshState();
const KEY = 'castaway-proto-v2';
let saveT = 0;
function saveNow() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 150); }
function load(seed) {
  let d = seed && seed.v ? seed : null;
  if (!d) { try { const raw = localStorage.getItem(KEY); if (raw) d = JSON.parse(raw); } catch (e) {} }
  if (d && d.v === 2) { d.v = 3; d.pending = null; } // v2 -> v3: the catch screen holds the fish until you decide
  if (d && d.v === 3) { // v3 -> v4: the roster became real species; remap ids, drop anything with no species
    const fix = id => ID_MAP_V3[id] || id, ix = {};
    for (const k in d.index || {}) { const n = fix(k); if (!SP[n]) continue; const a = ix[n] || (ix[n] = { n: 0, best: 0, trophies: 0 }), b = d.index[k]; a.n += b.n; a.best = Math.max(a.best, b.best); a.trophies += b.trophies; }
    d.index = ix;
    d.bucket = (d.bucket || []).map(f => Object.assign({}, f, { id: fix(f.id) })).filter(f => SP[f.id]);
    if (d.pending) { d.pending.id = fix(d.pending.id); if (!SP[d.pending.id]) d.pending = null; }
    (d.lines || []).forEach(L => { if (L && L.c) { L.c.id = fix(L.c.id); if (!SP[L.c.id]) { L.phase = 'idle'; L.c = null; } } });
    d.v = 4;
  }
  if (d && d.v === 4) { // v4 -> v5: catches carry a weight; derive one for everything already caught
    (d.bucket || []).forEach(f => { if (f.kg == null && SP[f.id]) f.kg = kgOf(SP[f.id], f.cm, 0); });
    for (const k in d.index || {}) if (d.index[k].bestKg == null && SP[k]) d.index[k].bestKg = kgOf(SP[k], d.index[k].best, 0);
    if (d.pending && d.pending.kg == null && SP[d.pending.id]) d.pending.kg = kgOf(SP[d.pending.id], d.pending.cm, 0);
    (d.lines || []).forEach(L => { if (L && L.c && L.c.kg == null && SP[L.c.id]) L.c.kg = kgOf(SP[L.c.id], L.c.cm, 0); });
    d.v = 5;
  }
  if (d && d.v === 5) S = Object.assign(freshState(), d);
}

const loc = () => LOC[S.loc];
const boatRange = () => BOATS.find(b => b.id === S.boat).range;
const rodBar = () => RODS.find(r => r.id === S.rod).bar;
const hourAt = t => (t / T.hourMs) % 24;
const phaseAt = t => { const h = hourAt(t); return h >= 5 && h < 7 ? 'dawn' : h >= 7 && h < 18 ? 'day' : h >= 18 && h < 20 ? 'dusk' : 'night'; };
function clockText(t) { const h = hourAt(t), hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return `${pad(hh)}:${pad(mm)} · ${PHASE_NAME[phaseAt(t)]}`; }

// ---------- fishing ----------
function pool(locId, rig, baitId, t) {
  const ph = phaseAt(t), bt = BAITS[baitId].tier, out = [];
  for (const s of SPECIES) {
    const w0 = s.loc[locId]; if (!w0) continue;
    if (s.time && !s.time.includes(ph)) continue;
    if ((s.minBait || 0) > bt) continue;
    if (s.rare && rig === 'set') continue;
    let w = w0;
    if (s.kind === 'wood' && S.raft) w = 6;
    if (s.rare && rig === 'trophy') w *= 4;
    if (!s.kind && bt > 0 && (s.minBait || 0) === bt) w *= 1.5;
    if (rig === 'set' && s.shape === 'big') w *= 0.5;
    out.push([s, w]);
  }
  return out;
}
function rollCatch(locId, rig, baitId, t) {
  const p = pool(locId, rig, baitId, t); if (!p.length) return null;
  const tot = p.reduce((a, x) => a + x[1], 0);
  let r = Math.random() * tot, s = p[p.length - 1][0];
  for (const [sp, w] of p) { r -= w; if (r <= 0) { s = sp; break; } }
  const skew = rig === 'trophy' ? 0.45 : rig === 'set' ? 1.7 : 1;
  const f = rig === 'set' ? Math.min(0.8, Math.pow(Math.random(), skew)) : Math.pow(Math.random(), skew); // set lines never reach trophy size
  const cm = s.kind ? 0 : Math.round(s.size[0] + (s.size[1] - s.size[0]) * f);
  const trophy = !s.kind && f >= 0.85;
  const value = s.kind ? 0 : Math.round(s.value * (0.6 + 0.9 * f)) * (trophy ? 2 : 1);
  return { id: s.id, cm, kg: s.kind ? 0 : kgOf(s, cm, rnd(-0.08, 0.08)), value, trophy };
}
function waitFor(rig) { const [a, b] = rig === 'hand' ? T.handWait : rig === 'set' ? T.setWait : T.trophyWait; return rnd(a, b); }

function castLine(i) {
  const L = S.lines[i]; if (!L || L.phase !== 'idle') return;
  if (L.rig === 'hand' && S.lines.some((o, j) => o && j !== i && o.rig === 'hand' && o.phase !== 'idle')) { toast('One rod at a time. Pull the other one in.'); return; }
  if (L.rig === 'trophy' && BAITS[L.bait].tier < 1) { toast('The trophy line needs shrimp or squid.'); return; }
  if (L.bait !== 'scraps') {
    if ((S.bait[L.bait] || 0) <= 0) { toast('Out of ' + BAITS[L.bait].name.toLowerCase() + '.'); return; }
    S.bait[L.bait]--;
  }
  const at = now() + waitFor(L.rig);
  L.phase = 'waiting'; L.t0 = now(); L.at = at; L.c = rollCatch(S.loc, L.rig, L.bait, at);
  S.casts++; save(); render();
}
function pullLine(i) { const L = S.lines[i]; if (!L) return; L.phase = 'idle'; L.c = null; save(); render(); }
function reelLine(i) {
  const L = S.lines[i]; if (!L || L.phase !== 'bite') return;
  if (SP[L.c.id].kind) { land(i); return; }
  startFight(i);
}
function haulLine(i) {
  const L = S.lines[i]; if (!L || L.phase !== 'hooked') return;
  if (L.rig === 'trophy' && !SP[L.c.id].kind) { startFight(i); return; }
  land(i);
}
function land(i) {
  const L = S.lines[i], c = L.c, s = SP[c.id];
  L.phase = 'idle'; L.c = null;
  const p = { id: c.id, cm: c.cm, kg: c.kg, value: c.value, trophy: c.trophy, bait: L.bait, rig: L.rig, phase: phaseAt(now()), wait: L.t0 ? Math.max(0, (L.at || now()) - L.t0) : 0, tags: [] };
  if (s.kind) {
    if (s.kind === 'wood' && !S.raft) { S.wood++; if (S.wood >= T.raftWood) p.tags.push('Enough for a raft'); }
  } else {
    const ix = S.index[c.id] || (S.index[c.id] = { n: 0, best: 0, trophies: 0 });
    if (ix.n === 0) p.tags.push('New species');
    if (c.cm > ix.best) { if (ix.n > 0) p.tags.push('New record'); ix.best = c.cm; }
    if ((c.kg || 0) > (ix.bestKg || 0)) ix.bestKg = c.kg;
    ix.n++;
    if (c.trophy) { ix.trophies++; p.tags.push('Trophy size'); }
  }
  S.pending = p; save(); render(); showCatch();
}
// how: 'sell' (market only) | 'keep' (bucket) | 'release' | 'ok' (wood and junk)
function resolveCatch(how) {
  const p = S.pending; if (!p) return;
  const s = SP[p.id]; S.pending = null; closeCard();
  if (!s.kind) {
    if (how === 'sell' && loc().sell) { S.money += p.value; S.sold += p.value; toast(`Sold the ${s.name.toLowerCase()} for ${money(p.value)}.`); }
    else if (how === 'keep' && S.bucket.length < T.bucketCap) { S.bucket.push({ id: p.id, cm: p.cm, kg: p.kg, value: p.value, trophy: p.trophy }); toast(`Into the bucket. ${S.bucket.length}/${T.bucketCap}.`); }
    else toast('Released.');
  } else if (s.kind === 'junk') toast('Tossed back.');
  save(); render();
}
function releaseFish(j) { if (!S.bucket[j]) return; S.bucket.splice(j, 1); save(); render(); renderSheet(); toast('Released.'); }
function sellHaul() {
  if (!loc().sell || !S.bucket.length) return;
  const total = S.bucket.reduce((a, b) => a + b.value, 0), n = S.bucket.length;
  S.money += total; S.sold += total; S.bucket = [];
  save(); render(); toast(`Sold ${n} fish for ${money(total)}.`);
}
function buildRaft() {
  if (S.raft || S.wood < T.raftWood) return;
  S.raft = true; S.boat = 'raft'; save(); render();
  showCard(`<h2>Raft built</h2><div class="big">Six planks and some rope.</div><div class="note">Gull Harbor is within reach. Open the map and sail. They buy fish there.</div><div class="note">tap to close</div>`);
}
function sail(id) {
  const L = LOC[id]; if (!L || L.locked || L.range > boatRange() || id === S.loc) return;
  let pulled = 0;
  S.lines.forEach(l => { if (l && l.phase !== 'idle') { l.phase = 'idle'; l.c = null; pulled++; } });
  S.loc = id; S.visited[id] = true; reseedFish(); save(); closeSheet(); render();
  toast(`Sailed to ${L.name}.` + (pulled ? ` Pulled in ${pulled} line${pulled > 1 ? 's' : ''}.` : ''));
}

// ---------- shop ----------
function shopItems() {
  const items = [];
  if (S.slots < 4) items.push({ k: 'slot', name: `Line ${S.slots + 1}`, sub: 'One more line in the water.', price: SLOT_PRICES[S.slots] });
  const ri = RODS.findIndex(r => r.id === S.rod);
  if (ri < RODS.length - 1) { const r = RODS[ri + 1]; items.push({ k: 'rod', name: r.name, sub: `Wider net in the fight (${Math.round(r.bar * 100)}% of the track).`, price: r.price }); }
  if (!S.trophyRig) items.push({ k: 'trig', name: 'Trophy rig', sub: 'A long passive line. Needs shrimp or squid. Hooks big fish; you still land them yourself.', price: TROPHY_RIG_PRICE });
  items.push({ k: 'bait:shrimp', name: 'Shrimp ×5', sub: `Have ${S.bait.shrimp}. Mid-size fish, and the trophy rig.`, price: BAITS.shrimp.price });
  items.push({ k: 'bait:squid', name: 'Squid ×5', sub: `Have ${S.bait.squid}. Deep and rare fish take only this.`, price: BAITS.squid.price });
  const bi = BOATS.findIndex(b => b.id === S.boat);
  if (bi >= 1 && bi < BOATS.length - 1) {
    const b = BOATS[bi + 1];
    items.push({ k: 'boat', name: b.name, sub: b.locked ? 'Not in this build. The price is the point.' : `Range ${b.range}: reveals the next stretch of the chart.`, price: b.price, locked: b.locked });
  }
  return items;
}
function buy(k) {
  const it = shopItems().find(x => x.k === k); if (!it || it.locked) return;
  if (S.money < it.price) { toast('Not enough money.'); return; }
  S.money -= it.price;
  if (k === 'slot') { S.slots++; S.lines[S.slots - 1] = { rig: 'set', bait: 'scraps', phase: 'idle' }; }
  else if (k === 'rod') { const ri = RODS.findIndex(r => r.id === S.rod); S.rod = RODS[ri + 1].id; }
  else if (k === 'trig') S.trophyRig = true;
  else if (k.startsWith('bait:')) { const b = k.slice(5); S.bait[b] = (S.bait[b] || 0) + BAITS[b].qty; }
  else if (k === 'boat') { const bi = BOATS.findIndex(b => b.id === S.boat); S.boat = BOATS[bi + 1].id; }
  save(); render(); renderSheet(); toast(`Bought ${it.name}.`);
}

// ---------- ticking ----------
let lastPhase = null;
function tick() {
  if (MODE !== 'game') return;
  const t = now(); let changed = false;
  S.lines.forEach((L, i) => {
    if (!L) return;
    if (L.phase === 'waiting' && t >= L.at) {
      if (!L.c) { L.phase = 'idle'; toast(`Line ${i + 1}: nothing's biting on that.`); changed = true; return; }
      if (L.rig === 'hand') { L.phase = 'bite'; L.exp = L.at + T.hitWindow; S.sel = i; toast(`HIT on line ${i + 1}!`); }
      else { L.phase = 'hooked'; toast(`Line ${i + 1}: something's on.`); }
      changed = true;
    } else if (L.phase === 'bite' && t > L.exp) {
      L.phase = 'idle'; L.c = null; toast(`Line ${i + 1}: it spat the hook.`); changed = true;
    }
  });
  if (changed) { save(); render(); return; }
  $('#hClock').textContent = clockText(t);
  const ph = phaseAt(t); if (ph !== lastPhase) renderTide();
  $('#ready').textContent = readyText();
  document.querySelectorAll('[data-line]').forEach(el => {
    const L = S.lines[+el.dataset.line]; if (!L) return;
    el.textContent = el.classList.contains('st') ? slotStatus(L) : waitNote(L);
  });
}

// ---------- rendering (DOM) ----------
function render() { if (MODE !== 'game') return; renderHUD(); renderTide(); renderSlots(); renderAction(); renderExtra(); }
function renderHUD() {
  $('#hLoc').textContent = loc().name;
  $('#hClock').textContent = clockText(now());
  $('#hMoney').textContent = money(S.money);
  $('#hBucket').textContent = `Bucket ${S.bucket.length}/${T.bucketCap}`;
  $('#tShop').hidden = !loc().shop;
  $('#tMap').classList.toggle('pulse', S.raft && S.loc === 'shoal' && !S.visited.harbor);
}
function renderTide() {
  const t = now(); lastPhase = phaseAt(t);
  const names = pool(S.loc, 'hand', 'squid', t).filter(x => !x[0].kind && !x[0].rare).map(x => x[0].name);
  $('#tide').innerHTML = `<b>${PHASE_NAME[lastPhase]}</b> · biting: ${names.slice(0, 2).join(', ') || 'not much'}`;
}
const RIG_NAME = { hand: 'rod', set: 'set', trophy: 'trophy' };
function secsLeft(L) { return Math.max(1, Math.ceil((L.at - now()) / 1000)); }
function slotStatus(L) {

  if (L.phase === 'waiting') return L.rig === 'hand' ? 'waiting…' : `~${secsLeft(L)}s`;
  if (L.phase === 'bite') return 'HIT!';
  return 'ON!';
}
function waitNote(L) {

}
function rigNote(L) {
  if (L.rig === 'hand') return 'Tap Reel on the hit, then keep the fish in the net.';
  if (L.rig === 'set') return 'Hooks in a minute or so, even while you are away. Common fish, no fight.';
  return 'Takes minutes. Hooks big fish. Needs shrimp or squid. You still land it.';
}
function readyText() { const n = S.lines.filter(L => L && L.phase === 'idle').length, hot = S.lines.filter(L => L && (L.phase === 'bite' || L.phase === 'hooked')).length; return hot ? `${hot} on!` : `${n} line${n === 1 ? '' : 's'} ready`; }
function renderSlots() {
  $('#ready').textContent = readyText();
  let h = '';

    const L = S.lines[i];
    if (i >= S.slots || !L) { h += `<div class="slot lock"><div class="n">LINE ${i + 1}</div><div class="st">${money(SLOT_PRICES[i])}</div></div>`; continue; }
    const cls = ['slot', i === S.sel ? 'sel' : '', L.phase === 'bite' ? 'hot' : '', (L.phase === 'hooked' || L.phase === 'waiting') ? 'on' : ''].join(' ');
    h += `<button class="${cls}" data-act="sel" data-i="${i}"><div class="n">LINE ${i + 1}</div><div class="st" data-line="${i}">${slotStatus(L)}</div></button>`;

let rigOpen = false; // the rig and bait pickers are folded behind CHANGE unless you open them
const RIG_LABEL = { hand: 'ROD', set: 'SET LINE', trophy: 'TROPHY' };

      <div class="segrow"><span class="lbl">BAIT</span><div class="seg">${Object.entries(BAITS).map(([k, b]) => `<button data-act="bait" data-k="${k}" class="${L.bait === k ? 'sel' : ''}" ${k !== 'scraps' && !(S.bait[k] > 0) ? 'disabled' : ''}>${k === 'scraps' ? 'Scraps' : b.name + ' ×' + S.bait[k]}</button>`).join('')}</div></div>` : '';

function mapClick(e) {

// ---------- cards & toasts ----------
function showCard(html) { $('#card').className = 'card'; $('#card').innerHTML = html; $('#cardWrap').hidden = false; }
function closeCard() { $('#cardWrap').hidden = true; }
function fmtDur(ms) { const sec = Math.round(ms / 1000); if (sec < 60) return sec + 's'; const m = Math.floor(sec / 60), r = sec % 60; return m < 60 ? `${m}m${r ? ' ' + r + 's' : ''}` : `${Math.floor(m / 60)}h ${m % 60}m`; }
// The catch screen. The fish is held in S.pending until you Sell (market only), Keep (bucket) or Release it.
function showCatch() {
  const p = S.pending; if (!p) return;
  const s = SP[p.id], full = S.bucket.length >= T.bucketCap, canSell = loc().sell;

      + `<button class="cta ${canSell ? 'alt' : ''}" data-act="catch" data-k="keep" ${full ? 'disabled' : ''}>Keep</button>`

  }

    : `${RIG_LABEL[p.rig].toLowerCase()}${p.wait ? ' · after ' + fmtDur(p.wait) : ''}`;

      <div class="stat"><div class="n">TIME</div><div class="v">${PHASE_NAME[p.phase]}</div></div></div>`;

  $('#card').innerHTML = `<div class="head">${head}</div>
    ${pills.length ? `<div class="pills">${pills.map(t => `<div class="pill ${t === 'Trophy size' ? 'gold' : ''}">${t.toUpperCase()}</div>`).join('')}</div>` : ''}
    <canvas class="art" id="ccv" width="192" height="96"></canvas>

    <div class="sub">${sub}</div>

    ${canSell && !s.kind ? '<div class="note">Keep it to sell the whole haul later, or take the money now.</div>' : !s.kind && !S.raft ? '<div class="note">No market on the shoal. Keep it for the first port.</div>' : ''}
    <div class="acts">${acts}</div>`;
  $('#cardWrap').hidden = false;
  const cv2 = $('#ccv'), x = cv2.getContext('2d');
  x.imageSmoothingEnabled = false;
  const g = x.createLinearGradient(0, 0, 0, 96); g.addColorStop(0, p.trophy ? '#2c4d6b' : '#1f4a6a'); g.addColorStop(1, '#0a1a2c');
  x.fillStyle = g; x.fillRect(0, 0, 192, 96);
  for (const [sx, sw, a] of [[22, 12, .05], [70, 8, .04], [112, 15, .05], [162, 7, .03]]) { const sg = x.createLinearGradient(0, 0, 0, 90); sg.addColorStop(0, `rgba(255,255,255,${a})`); sg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = sg; x.fillRect(sx, 0, sw, 90); } // light shafts
  x.fillStyle = 'rgba(255,255,255,0.35)'; for (let k = 0; k < 192; k += 7) x.fillRect(k + (k % 3), 1, 3, 1); // surface glints
  x.fillStyle = '#152638'; x.fillRect(0, 90, 192, 6); x.fillStyle = '#1e3448'; for (let k = 3; k < 192; k += 11) x.fillRect(k, 89, 4, 1); // seabed
  x.fillStyle = 'rgba(223,233,243,.35)'; for (let k = 0; k < 12; k++) x.fillRect((k * 41 + 9) % 192, (k * 17 + 7) % 84, 1, 1); // motes
  const fm = fishMap(p.id), fsc = fm.length * 3 > 88 || fm[0].length * 3 > 188 ? 2 : 3; // 3x unless the fish would not fit the panel

}

const CUT = [
  { dur: 6000, cap: 'The storm took the boat.', draw: drawStorm },
  { dur: 5500, cap: 'It did not take the rod.', draw: drawDrift },
  { dur: 5000, cap: 'Wreck Shoal. Morning.', draw: (p, t) => beachScene(t, 6.4 + p * 0.5, 'lie') },
  { dur: 6000, cap: 'No boat. No market. Nobody coming.<br>Six planks make a raft.', draw: (p, t) => beachScene(t, 7.0 + p * 0.5, 'sit') },

let MODE = 'title', cut = null, capT = 0;
function setCap() { const c = $('#cap'); c.classList.remove('show'); c.innerHTML = CUT[cut.i].cap; capT = setTimeout(() => c.classList.add('show'), 500); }
function startCut() { MODE = 'cut'; cut = { i: 0, t0: performance.now() }; $('#title').hidden = true; $('#game').hidden = true; $('#cut').hidden = false; setCap(); }

function enterGame() { MODE = 'game'; $('#title').hidden = true; $('#cut').hidden = true; $('#game').hidden = false; reseedFish(); render(); window.scrollTo(0, 0); if (S.pending) showCatch(); }
function showTitle() { MODE = 'title'; $('#game').hidden = true; $('#cut').hidden = true; $('#title').hidden = false; $('#bCont').hidden = !S.started; $('#bNew').textContent = S.started ? 'Start over' : 'New voyage'; $('#confirm').textContent = ''; confirmNew = false; }
function fadeTo(fn) { const f = $('#fade'); f.classList.add('on'); setTimeout(() => { fn(); setTimeout(() => f.classList.remove('on'), 80); }, 600); }
let confirmNew = false;

  if (S.started && !confirmNew) { confirmNew = true; $('#confirm').textContent = 'This wipes your save. Tap again to start over.'; return; }
  S = freshState(); S.started = true; saveNow();

// ---------- frame loop ----------
let lastFrame = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastFrame) / 1000); lastFrame = ts;
  if (!document.hidden) {
    const t = now();
    if (MODE === 'game') { stepFish(dt); drawGame(t); }

}

// ---------- chart ----------
function drawMap() {

  for (let i = 0; i < 160; i++) { m.fillStyle = 'rgba(90,70,40,0.12)'; m.fillRect((i * 37) % 160, (i * 53) % 120, 1, 1); }
  m.fillStyle = 'rgba(60,80,110,0.3)'; for (let y = 8; y < 120; y += 10) for (let x = ((y / 10) % 2) * 5; x < 160; x += 11) { m.fillRect(x, y, 2, 1); m.fillRect(x + 2, y - 1, 2, 1); }
  m.fillStyle = 'rgba(40,50,80,0.18)'; for (let y = 30; y < 60; y += 2) m.fillRect(104 + (y % 4 === 0 ? 1 : 0), y, 40, 1);
  m.fillStyle = '#5a4630'; m.fillRect(0, 0, 160, 2); m.fillRect(0, 118, 160, 2); m.fillRect(0, 0, 2, 120); m.fillRect(158, 0, 2, 120);

    if (l.id === S.loc) { m.fillStyle = '#5a4630'; m.fillRect(x - 4, y + 7, 9, 2); m.fillRect(x, y + 3, 1, 4); m.fillRect(x + 1, y + 4, 3, 2); }

// ---------- the fight ----------
let F = null;
const fcv = $('#fcv'), fg = fcv.getContext('2d');
function startFight(i) {
  const L = S.lines[i], s = SP[L.c.id], bar = rodBar();
  F = { i, s, diff: clamp(s.diff + (L.rig === 'trophy' ? 0.08 : 0) + (L.c.trophy ? 0.06 : 0), 0, 0.97), fy: 0.5, tgt: 0.5, tNext: 0.4, by: 0.5 - bar / 2, bv: 0, bar, p: 0.3, hold: false, inside: false, last: performance.now(), over: false, trophy: L.c.trophy };
  $('#fname').textContent = s.name + (L.c.trophy ? ' · trophy size' : '');
  $('#fightWrap').hidden = false;
  requestAnimationFrame(fightFrame);
}
function fightFrame(ts) {

  const d = F.diff, s = F.s;
  F.tNext -= dt;
  if (F.tNext <= 0) {
    if (s.beh === 'dart') { F.tgt = Math.random(); F.tNext = rnd(0.35, 0.9); }
    else if (s.beh === 'sinker') { F.tgt = Math.random() < 0.25 ? rnd(0.05, 0.5) : rnd(0.6, 1); F.tNext = rnd(0.8, 1.8); }
    else if (s.beh === 'floater') { F.tgt = Math.random() < 0.25 ? rnd(0.5, 0.95) : rnd(0, 0.4); F.tNext = rnd(0.8, 1.8); }
    else { F.tgt = Math.random(); F.tNext = rnd(1.2, 2.4); }
  }

  F.fy = Math.abs(F.tgt - F.fy) <= step ? F.tgt : F.fy + dir * step;

  fg.fillStyle = 'rgba(255,255,255,0.35)'; for (let x = 24; x < 88; x += 6) fg.fillRect(x + ((ts / 200) % 6 | 0), 2, 3, 1);
  fg.fillStyle = 'rgba(255,255,255,0.06)'; for (let y = 12; y < 128; y += 14) fg.fillRect(24, y, 64, 1);

  fg.fillStyle = '#b8871c'; for (let y = by + 3; y < by + bh - 2; y += 4) { fg.fillRect(26, y, 1, 1); fg.fillRect(85, y, 1, 1); }

function endFight(win) {

  else { const L = S.lines[i]; L.phase = 'idle'; L.c = null; save(); render(); toast('It threw the hook.'); }
}

// ---------- input ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i, k = b.dataset.k;
  if (a === 'sel') { S.sel = i; save(); render(); }
  else if (a === 'rig') { const L = S.lines[S.sel]; L.rig = k; if (k === 'trophy' && L.bait === 'scraps') L.bait = S.bait.shrimp > 0 ? 'shrimp' : S.bait.squid > 0 ? 'squid' : 'scraps'; save(); render(); }
  else if (a === 'bait') { S.lines[S.sel].bait = k; save(); render(); }
  else if (a === 'cyclerig') { const L = S.lines[S.sel]; if (L && L.phase === 'idle') { cycleRig(L); save(); render(); } }
  else if (a === 'cyclebait') { const L = S.lines[S.sel]; if (L && L.phase === 'idle') { cycleBait(L); save(); render(); } }
  else if (a === 'change') { rigOpen = !rigOpen; render(); }
  else if (a === 'catch') resolveCatch(k);
  else if (a === 'release') releaseFish(i);
  else if (a === 'cast') castLine(i);
  else if (a === 'pull') pullLine(i);
  else if (a === 'reel') reelLine(i);
  else if (a === 'haul') haulLine(i);

const fw = $('#fightWrap');
fw.addEventListener('pointerdown', e => { e.preventDefault(); if (F) F.hold = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => fw.addEventListener(ev, () => { if (F) F.hold = false; }));

window.addEventListener('keydown', e => { if (e.code === 'Space' && F) { e.preventDefault(); F.hold = true; } });

// ---------- boot ----------
function start(data) {
  load(data);
  for (let i = 0; i < S.slots; i++) if (!S.lines[i]) S.lines[i] = { rig: 'set', bait: 'scraps', phase: 'idle' };
  S.sel = clamp(S.sel, 0, S.slots - 1);
  const t = now(); let got = 0;
  S.lines.forEach(L => {
    if (!L) return;
    if (L.phase === 'waiting' && t >= L.at) {
      if (L.rig === 'hand') { L.phase = 'idle'; L.c = null; }
      else { L.phase = L.c ? 'hooked' : 'idle'; if (L.c) got++; }
    } else if (L.phase === 'bite' && t > L.exp) { L.phase = 'idle'; L.c = null; }
  });
  layout();
  showTitle();
  if (got) setTimeout(() => toast(`While you were gone: ${got} line${got > 1 ? 's' : ''} hooked something.`), 900);
  setInterval(tick, 500);

  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => S); } catch (e) {}
}
const boot = () => { const hot = window.claude && window.claude.hot; if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null); };
boot();

})();
